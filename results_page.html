<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NLNG Voting Results - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --nlng-green: #006b3f;
      --nlng-light-green: #00a859;
      --nlng-yellow: #ffd700;
      --nlng-dark: #003300;
      --text-light: #ffffff;
      --text-dark: #333333;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text-light);
      text-align: center;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background: var(--nlng-dark);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #003300 0%, #006b3f 100%);
      z-index: -2;
    }

    .container {
      background: rgba(255,255,255,0.08);
      padding: 30px;
      border-radius: 20px;
      width: 95%;
      max-width: 1400px;
      backdrop-filter: blur(8px);
      margin: 40px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Header Styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .logo img {
      height: 80px;
      width: auto;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }

    .title-section {
      flex-grow: 1;
      text-align: center;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    h2 {
      font-weight: normal;
      font-size: 1.3em;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    /* Stats Section */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(0,107,63,0.3);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-size: 2.5em;
      font-weight: bold;
      color: var(--nlng-yellow);
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9em;
      opacity: 0.8;
    }

    /* Results Sections */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .award-results {
      background: rgba(0,107,63,0.15);
      border-radius: 15px;
      padding: 25px;
      text-align: left;
    }

    .award-title {
      font-size: 1.5em;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--nlng-yellow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .award-title i {
      color: var(--nlng-yellow);
    }

    .candidate-results {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .candidate-result {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      transition: 0.3s;
    }

    .candidate-result.winner {
      background: rgba(255,215,0,0.2);
      border: 2px solid var(--nlng-yellow);
    }

    .candidate-image {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }

    .candidate-info {
      flex-grow: 1;
    }

    .candidate-name {
      font-size: 1.1em;
      font-weight: bold;
    }

    .candidate-role {
      font-size: 0.9em;
      opacity: 0.8;
    }

    .vote-count {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--nlng-yellow);
      min-width: 60px;
      text-align: center;
    }

    .vote-bar-container {
      flex-grow: 1;
      height: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .vote-bar {
      height: 100%;
      background: var(--nlng-light-green);
      border-radius: 10px;
      transition: width 1s ease;
    }

    /* Controls */
    .controls {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .control-btn {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background-color: var(--nlng-green);
      color: var(--text-light);
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .control-btn:hover {
      background-color: var(--nlng-light-green);
    }

    .back-btn {
      background-color: #444;
    }

    .back-btn:hover {
      background-color: #666;
    }

    /* Footer */
    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.9em;
      opacity: 0.7;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 20px;
      }
      
      .stats-container {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .candidate-result {
        flex-direction: column;
        text-align: center;
      }
      
      .vote-bar-container {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="https://i.imgur.com/3Q1qY7Z.png" alt="NLNG Logo">
      </div>
      <div class="title-section">
        <h1>NLNG Employee Excellence Awards</h1>
        <h2>Voting Results - Admin Dashboard</h2>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-container" id="statsContainer">
      <div class="stat-card">
        <div class="stat-number" id="totalVotes">0</div>
        <div class="stat-label">Total Votes</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalVoters">0</div>
        <div class="stat-label">Total Voters</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="participationRate">0%</div>
        <div class="stat-label">Participation Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="leadingCategory">-</div>
        <div class="stat-label">Most Competitive</div>
      </div>
    </div>

    <!-- Results Container -->
    <div class="results-container" id="resultsContainer">
      <!-- Results will be dynamically added here -->
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Refresh Results
      </button>
      <button class="control-btn back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i> Back to Voting
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>NLNG Employee Excellence Awards 2023 | Admin Dashboard</p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBtCudg-7Z5ZwjCs8XroeOqa2qlvOIOV4w",
      authDomain: "nlng-voting-system.firebaseapp.com",
      databaseURL: "https://nlng-voting-system-default-rtdb.firebaseio.com",
      projectId: "nlng-voting-system",
      storageBucket: "nlng-voting-system.firebasestorage.app",
      messagingSenderId: "851277078103",
      appId: "1:851277078103:web:54066162daafda99470d12",
      measurementId: "G-D6MX1JL08C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Awards data (same as voting page)
    const awardsData = [
      {
        id: "leadership",
        name: "Leadership Excellence Award",
        icon: "fas fa-trophy",
        candidates: [
          { name: "John Okafor", role: "Senior Manager", img: "https://i.pravatar.cc/150?img=1" },
          { name: "Amina Bello", role: "Department Head", img: "https://i.pravatar.cc/150?img=2" },
          { name: "Chinedu Nwosu", role: "Team Lead", img: "https://i.pravatar.cc/150?img=3" },
          { name: "Grace Eze", role: "Project Manager", img: "https://i.pravatar.cc/150?img=4" }
        ]
      },
      {
        id: "innovation",
        name: "Innovation Award",
        icon: "fas fa-lightbulb",
        candidates: [
          { name: "Emeka Uche", role: "R&D Specialist", img: "https://i.pravatar.cc/150?img=5" },
          { name: "Ifeoma Okeke", role: "Product Developer", img: "https://i.pravatar.cc/150?img=6" },
          { name: "Umar Danladi", role: "Tech Lead", img: "https://i.pravatar.cc/150?img=7" },
          { name: "Ngozi Udo", role: "Innovation Manager", img: "https://i.pravatar.cc/150?img=8" }
        ]
      },
      {
        id: "teamwork",
        name: "Teamwork Award",
        icon: "fas fa-users",
        candidates: [
          { name: "Fatima Ahmed", role: "Team Coordinator", img: "https://i.pravatar.cc/150?img=9" },
          { name: "Samuel Johnson", role: "Collaboration Lead", img: "https://i.pravatar.cc/150?img=10" },
          { name: "Ruth Okon", role: "Project Coordinator", img: "https://i.pravatar.cc/150?img=11" },
          { name: "David Musa", role: "Department Lead", img: "https://i.pravatar.cc/150?img=12" }
        ]
      },
      {
        id: "customer-service",
        name: "Customer Service Excellence",
        icon: "fas fa-headset",
        candidates: [
          { name: "Susan Adebayo", role: "Client Relations", img: "https://i.pravatar.cc/150?img=13" },
          { name: "Michael Okoro", role: "Support Specialist", img: "https://i.pravatar.cc/150?img=14" },
          { name: "Patience Eze", role: "Customer Success", img: "https://i.pravatar.cc/150?img=15" },
          { name: "James Okafor", role: "Service Manager", img: "https://i.pravatar.cc/150?img=16" }
        ]
      },
      {
        id: "safety",
        name: "Safety Excellence Award",
        icon: "fas fa-shield-alt",
        candidates: [
          { name: "Bola Adekunle", role: "Safety Officer", img: "https://i.pravatar.cc/150?img=17" },
          { name: "Tunde Lawal", role: "Compliance Manager", img: "https://i.pravatar.cc/150?img=18" },
          { name: "Chioma Nwankwo", role: "Risk Analyst", img: "https://i.pravatar.cc/150?img=19" },
          { name: "Peter Okon", role: "Safety Coordinator", img: "https://i.pravatar.cc/150?img=20" }
        ]
      }
    ];

    // DOM Elements
    const statsContainer = document.getElementById('statsContainer');
    const totalVotes = document.getElementById('totalVotes');
    const totalVoters = document.getElementById('totalVoters');
    const participationRate = document.getElementById('participationRate');
    const leadingCategory = document.getElementById('leadingCategory');
    const resultsContainer = document.getElementById('resultsContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const backBtn = document.getElementById('backBtn');

    // State variables
    let resultsData = {};
    let totalVotesCount = 0;

    // Initialize the page
    function initPage() {
      // Check admin authentication
      checkAdminAuth();
      
      // Set up event listeners
      setupEventListeners();
      
      // Load initial results
      loadResults();
    }

    // Check if user is authenticated as admin
    function checkAdminAuth() {
      const password = localStorage.getItem('nlngAdminAuth');
      if (password !== 'NLNG2025') {
        const enteredPassword = prompt('Enter admin password:');
        if (enteredPassword === 'NLNG2025') {
          localStorage.setItem('nlngAdminAuth', 'NLNG2025');
        } else {
          alert('Incorrect password. Access denied.');
          window.location.href = 'index.html';
        }
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      // Refresh button
      refreshBtn.addEventListener('click', () => {
        loadResults();
      });
      
      // Back button
      backBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    // Load results from Firebase
    async function loadResults() {
      try {
        // Get all votes to count total voters
        const votesRef = ref(db, 'votes');
        const votesSnapshot = await get(votesRef);
        const totalVotersCount = votesSnapshot.exists() ? Object.keys(votesSnapshot.val()).length : 0;
        
        totalVoters.textContent = totalVotersCount;
        
        // Get results data
        const resultsRef = ref(db, 'results');
        const resultsSnapshot = await get(resultsRef);
        
        if (resultsSnapshot.exists()) {
          resultsData = resultsSnapshot.val();
          renderResults();
          calculateStats();
        } else {
          resultsContainer.innerHTML = '<p>No votes have been cast yet.</p>';
        }
      } catch (error) {
        console.error("Error loading results:", error);
        alert("Error loading results. Please try again.");
      }
    }

    // Render results
    function renderResults() {
      resultsContainer.innerHTML = '';
      totalVotesCount = 0;
      
      awardsData.forEach(award => {
        const awardResults = document.createElement('div');
        awardResults.className = 'award-results';
        
        const awardResultData = resultsData[award.id] || {};
        const candidatesWithVotes = award.candidates.map(candidate => {
          return {
            ...candidate,
            votes: awardResultData[candidate.name] || 0
          };
        });
        
        // Sort by votes (descending)
        candidatesWithVotes.sort((a, b) => b.votes - a.votes);
        
        // Calculate total votes for this award
        const awardTotalVotes = candidatesWithVotes.reduce((sum, candidate) => sum + candidate.votes, 0);
        totalVotesCount += awardTotalVotes;
        
        // Find winner(s) - there might be ties
        const maxVotes = candidatesWithVotes[0]?.votes || 0;
        const winners = candidatesWithVotes.filter(candidate => candidate.votes === maxVotes && maxVotes > 0);
        
        awardResults.innerHTML = `
          <div class="award-title">
            <i class="${award.icon}"></i>
            <span>${award.name}</span>
            <span style="margin-left: auto; font-size: 0.8em; opacity: 0.7;">Total Votes: ${awardTotalVotes}</span>
          </div>
          <div class="candidate-results" id="candidates-${award.id}">
            <!-- Candidate results will be added here -->
          </div>
        `;
        
        resultsContainer.appendChild(awardResults);
        
        // Render candidate results
        const candidateResults = document.getElementById(`candidates-${award.id}`);
        candidatesWithVotes.forEach(candidate => {
          const isWinner = winners.some(winner => winner.name === candidate.name);
          const percentage = awardTotalVotes > 0 ? ((candidate.votes / awardTotalVotes) * 100).toFixed(1) : 0;
          
          const candidateElement = document.createElement('div');
          candidateElement.className = `candidate-result ${isWinner ? 'winner' : ''}`;
          candidateElement.innerHTML = `
            <img src="${candidate.img}" alt="${candidate.name}" class="candidate-image">
            <div class="candidate-info">
              <div class="candidate-name">${candidate.name}</div>
              <div class="candidate-role">${candidate.role}</div>
            </div>
            <div class="vote-count">${candidate.votes}</div>
            <div class="vote-bar-container">
              <div class="vote-bar" style="width: ${percentage}%"></div>
            </div>
            <div style="min-width: 50px; text-align: right;">${percentage}%</div>
          `;
          
          candidateResults.appendChild(candidateElement);
        });
      });
    }

    // Calculate and display statistics
    function calculateStats() {
      // Update total votes
      totalVotes.textContent = totalVotesCount;
      
      // Calculate participation rate (assuming 500 total employees for demo)
      const totalEmployees = 500;
      const votersCount = parseInt(totalVoters.textContent);
      const rate = ((votersCount / totalEmployees) * 100).toFixed(1);
      participationRate.textContent = `${rate}%`;
      
      // Find most competitive category (highest number of votes)
      let maxVotes = 0;
      let competitiveCategory = '-';
      
      awardsData.forEach(award => {
        const awardResultData = resultsData[award.id] || {};
        const awardTotalVotes = Object.values(awardResultData).reduce((sum, votes) => sum + votes, 0);
        
        if (awardTotalVotes > maxVotes) {
          maxVotes = awardTotalVotes;
          competitiveCategory = award.name;
        }
      });
      
      leadingCategory.textContent = competitiveCategory.length > 15 
        ? competitiveCategory.substring(0, 15) + '...' 
        : competitiveCategory;
    }

    // Initialize the page when loaded
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
