  <style>
    :root {
      --gradient-bg: linear-gradient(135deg, #003f5c, #2f4b7c, #665191, #a05195, #d45087);
      --form-bg: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(255, 255, 255, 0.1);
      --input-focus: #d45087;
      --btn-gradient: linear-gradient(90deg, #00c6ff, #0072ff);
      --accent1: #00ffcc;
      --accent2: #ffcc00;
      --accent3: #00c6ff;
      --white: #ffffff;
      --dark-text: #00151f;
      --gold: #FFD700;
      --silver: #C0C0C0;
      --bronze: #CD7F32;
    }

    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      background: var(--gradient-bg);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      color: var(--white);
      display: flex;
      flex-direction: column;
    }

    /* Background Animation */
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff33, transparent);
      animation: floaty 10s ease-in-out infinite;
      z-index: 0;
    }
    .orb:nth-child(1){ top: 10%; left: 15%; animation-delay: 0s; }
    .orb:nth-child(2){ top: 60%; right: 10%; animation-delay: 2s; }
    .orb:nth-child(3){ bottom: 15%; left: 45%; animation-delay: 4s; }

    @keyframes floaty {
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-20px); }
    }

    /* Logo */
    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .logo img {
      height: 65px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
      max-width: 100%;
    }

    /* Container */
    .container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 1400px;
      margin: 120px auto 50px auto;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      overflow-y: auto;
      max-height: none;
    }

    /* Headings */
    h1 {
      text-align: center;
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--accent2), var(--accent1), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 700;
    }

    h2 {
      text-align: center;
      font-weight: 400;
      font-size: 1.3rem;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    /* Stats Section */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--form-bg);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-number {
      font-size: 2.5em;
      font-weight: bold;
      color: var(--accent2);
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255,204,0,0.3);
    }

    .stat-label {
      font-size: 0.95em;
      opacity: 0.9;
      color: var(--accent1);
      font-weight: 600;
    }

    /* Results Sections */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .award-results {
      background: var(--form-bg);
      border-radius: 15px;
      padding: 25px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }

    .award-results:hover {
      transform: translateY(-3px);
    }

    .award-title {
      font-size: 1.5em;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent1);
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent1);
      font-weight: 600;
    }

    .award-title i {
      color: var(--accent1);
    }

    /* Winners Grid - Side by Side */
    .winners-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 10px;
    }

    .winner-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 25px 15px;
      border-radius: 15px;
      transition: all 0.3s ease;
      animation: slideIn 0.5s ease forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .winner-card.first-place {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
      border: 2px solid var(--gold);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
      order: 1;
    }

    .winner-card.second-place {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.15), rgba(192, 192, 192, 0.05));
      border: 2px solid var(--silver);
      box-shadow: 0 0 25px rgba(192, 192, 192, 0.2);
      order: 2;
    }

    .winner-card.third-place {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.15), rgba(205, 127, 50, 0.05));
      border: 2px solid var(--bronze);
      box-shadow: 0 0 25px rgba(205, 127, 50, 0.2);
      order: 3;
    }

    .position-ribbon {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9em;
      z-index: 2;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .position-ribbon.first {
      background-color: var(--gold);
      color: #000;
    }

    .position-ribbon.second {
      background-color: var(--silver);
      color: #000;
    }

    .position-ribbon.third {
      background-color: var(--bronze);
      color: #fff;
    }

    .winner-image-container {
      position: relative;
      margin-bottom: 15px;
    }

    .winner-image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255,255,255,0.9);
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .winner-card:hover .winner-image {
      transform: scale(1.05);
      border-color: var(--accent1);
    }

    .winner-info {
      width: 100%;
    }

    .winner-name {
      font-size: 1.3em;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .winner-position {
      font-size: 0.9em;
      opacity: 0.9;
      color: var(--accent1);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .winner-role {
      font-size: 0.85em;
      opacity: 0.8;
      color: var(--accent3);
      font-style: italic;
    }

    /* Medal icons */
    .medal-icon {
      font-size: 2em;
      margin-bottom: 15px;
    }

    .medal-icon.first {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .medal-icon.second {
      color: var(--silver);
      text-shadow: 0 0 10px rgba(192, 192, 192, 0.5);
    }

    .medal-icon.third {
      color: var(--bronze);
      text-shadow: 0 0 10px rgba(205, 127, 50, 0.5);
    }

    /* Controls */
    .controls {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 35px;
      background: var(--btn-gradient);
      color: var(--dark-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,198,255,0.4);
    }

    .back-btn {
      background: linear-gradient(90deg, #444, #666);
    }

    .back-btn:hover {
      background: linear-gradient(90deg, #555, #777);
    }

    /* Footer */
    footer {
      margin-top: auto;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.9rem;
      padding: 15px 0;
      letter-spacing: 0.5px;
      position: relative;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .winners-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      
      .winner-image {
        width: 100px;
        height: 100px;
      }
      
      .winner-name {
        font-size: 1.1em;
      }
    }

    @media (max-width: 768px) {
      .container {
        width: 95%;
        margin: 90px auto 30px auto;
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .stats-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .stat-card {
        padding: 20px;
      }

      .stat-number {
        font-size: 2em;
      }

      .winners-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .winner-card {
        flex-direction: row;
        text-align: left;
        padding: 20px;
        gap: 20px;
      }
      
      .winner-image-container {
        margin-bottom: 0;
        flex-shrink: 0;
      }
      
      .winner-image {
        width: 80px;
        height: 80px;
      }
      
      .position-ribbon {
        top: -8px;
        padding: 4px 15px;
        font-size: 0.8em;
      }
      
      .medal-icon {
        display: none;
      }

      .controls {
        flex-direction: column;
        align-items: center;
      }

      .control-btn {
        width: 100%;
        max-width: 300px;
        justify-content: center;
      }

      .logo img { height: 50px; }

      footer {
        font-size: 0.8rem;
        padding: 10px 0;
      }
    }

    @media (max-width: 480px) {
      .winner-card {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }
      
      .winner-image-container {
        margin-bottom: 10px;
      }
      
      .medal-icon {
        display: block;
      }
    }

    /* Animation delays for winner cards */
    .winner-card:nth-child(1) { animation-delay: 0.1s; }
    .winner-card:nth-child(2) { animation-delay: 0.2s; }
    .winner-card:nth-child(3) { animation-delay: 0.3s; }
  </style>
</head>

    // DOM Elements
    const resultsContainer = document.getElementById('resultsContainer');
    const backBtn = document.getElementById('backBtn');

    // Initialize the page
    function initPage() {
      // Set up event listeners
      setupEventListeners();
      
      // Render results
      renderResults();
    }

    // Setup event listeners
    function setupEventListeners() {
      // Back button
      backBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    // Render results in side-by-side layout
    function renderResults() {
      resultsContainer.innerHTML = '';
      
      awardsData.forEach(award => {
        const awardResults = document.createElement('div');
        awardResults.className = 'award-results';
        
        awardResults.innerHTML = `
          <div class="award-title">
            <i class="${award.icon}"></i>
            <span>${award.name}</span>
          </div>
          <div class="winners-grid" id="winners-${award.id}">
            <!-- Winners will be added here in side-by-side layout -->
          </div>
        `;
        
        resultsContainer.appendChild(awardResults);
        
        // Render winners in grid layout
        const winnersGrid = document.getElementById(`winners-${award.id}`);
        award.winners.forEach((winner, index) => {
          const positionClass = winner.position.includes('1st') ? 'first-place' : 
                               winner.position.includes('2nd') ? 'second-place' : 
                               'third-place';
          
          const positionText = winner.position.includes('1st') ? '1st' : 
                              winner.position.includes('2nd') ? '2nd' : '3rd';
          
          const medalIconClass = winner.position.includes('1st') ? 'first' : 
                                winner.position.includes('2nd') ? 'second' : 'third';
          
          const medalIcon = winner.position.includes('1st') ? 'fas fa-medal' : 
                           winner.position.includes('2nd') ? 'fas fa-medal' : 'fas fa-medal';
          
          const winnerCard = document.createElement('div');
          winnerCard.className = `winner-card ${positionClass}`;
          winnerCard.innerHTML = `
            <div class="position-ribbon ${medalIconClass}">${positionText}</div>
            <div class="winner-image-container">
              <img src="${winner.img}" alt="${winner.name}" class="winner-image">
            </div>
            <div class="winner-info">
              <div class="winner-name">${winner.name}</div>
              <div class="winner-position">${winner.position}</div>
              <div class="winner-role">${winner.role}</div>
            </div>
          `;
          
          winnersGrid.appendChild(winnerCard);
        });
      });
    }

    // Initialize the page when loaded
    document.addEventListener('DOMContentLoaded', initPage);
