<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NLNG Voting Results - Admin</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --gradient-bg: linear-gradient(135deg, #003f5c, #2f4b7c, #665191, #a05195, #d45087);
      --form-bg: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(255, 255, 255, 0.1);
      --input-focus: #d45087;
      --btn-gradient: linear-gradient(90deg, #00c6ff, #0072ff);
      --accent1: #00ffcc;
      --accent2: #ffcc00;
      --accent3: #00c6ff;
      --white: #ffffff;
      --dark-text: #00151f;
    }

    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      background: var(--gradient-bg);
      background-size: 400% 400%;
      animation: bgShift 20s ease infinite;
      color: var(--white);
      display: flex;
      flex-direction: column;
    }

    /* Background Animation */
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff33, transparent);
      animation: floaty 10s ease-in-out infinite;
      z-index: 0;
    }
    .orb:nth-child(1){ top: 10%; left: 15%; animation-delay: 0s; }
    .orb:nth-child(2){ top: 60%; right: 10%; animation-delay: 2s; }
    .orb:nth-child(3){ bottom: 15%; left: 45%; animation-delay: 4s; }

    @keyframes floaty {
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-20px); }
    }

    /* Logo */
    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .logo img {
      height: 65px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
      max-width: 100%;
    }

    /* Container */
    .container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 90%;
      max-width: 1400px;
      margin: 120px auto 50px auto;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      overflow-y: auto;
      max-height: none;
    }

    /* Headings */
    h1 {
      text-align: center;
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--accent2), var(--accent1), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      font-weight: 700;
    }

    h2 {
      text-align: center;
      font-weight: 400;
      font-size: 1.3rem;
      margin-bottom: 5px;
      opacity: 0.9;
    }

    /* Stats Section */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--form-bg);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-number {
      font-size: 2.5em;
      font-weight: bold;
      color: var(--accent2);
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255,204,0,0.3);
    }

    .stat-label {
      font-size: 0.95em;
      opacity: 0.9;
      color: var(--accent1);
      font-weight: 600;
    }

    /* Results Sections */
    .results-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .award-results {
      background: var(--form-bg);
      border-radius: 15px;
      padding: 25px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease;
    }

    .award-results:hover {
      transform: translateY(-3px);
    }

    .award-title {
      font-size: 1.5em;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent1);
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent1);
      font-weight: 600;
    }

    .award-title i {
      color: var(--accent1);
    }

    .candidate-results {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .candidate-result {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
      animation: slideIn 0.5s ease forwards;
      opacity: 0;
      transform: translateX(-20px);
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .candidate-result.winner {
      background: linear-gradient(135deg, rgba(255,204,0,0.2), rgba(255,215,0,0.1));
      border: 2px solid var(--accent2);
      box-shadow: 0 0 20px rgba(255,204,0,0.3);
    }

    .candidate-image {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.8);
      transition: all 0.3s ease;
    }

    .candidate-result:hover .candidate-image {
      border-color: var(--accent1);
      transform: scale(1.1);
    }

    .candidate-info {
      flex-grow: 1;
    }

    .candidate-name {
      font-size: 1.2em;
      font-weight: 600;
      color: var(--white);
    }

    .candidate-role {
      font-size: 0.9em;
      opacity: 0.8;
      color: var(--accent1);
    }

    .vote-count {
      font-size: 1.8em;
      font-weight: bold;
      color: var(--accent2);
      min-width: 70px;
      text-align: center;
      text-shadow: 0 0 10px rgba(255,204,0,0.3);
    }

    .vote-bar-container {
      flex-grow: 1;
      height: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .vote-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent1), var(--accent3));
      border-radius: 10px;
      transition: width 1s ease;
      box-shadow: 0 0 10px rgba(0,255,204,0.3);
    }

    /* Controls */
    .controls {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .control-btn {
      padding: 15px 30px;
      border: none;
      border-radius: 35px;
      background: var(--btn-gradient);
      color: var(--dark-text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,198,255,0.4);
    }

    .back-btn {
      background: linear-gradient(90deg, #444, #666);
    }

    .back-btn:hover {
      background: linear-gradient(90deg, #555, #777);
    }

    /* Footer */
    footer {
      margin-top: auto;
      width: 100%;
      text-align: center;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.9rem;
      padding: 15px 0;
      letter-spacing: 0.5px;
      position: relative;
    }

    /* Percentage Display */
    .percentage-display {
      min-width: 60px;
      text-align: right;
      font-weight: 600;
      color: var(--accent1);
      font-size: 1.1em;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        width: 95%;
        margin: 90px auto 30px auto;
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .stats-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .stat-card {
        padding: 20px;
      }

      .stat-number {
        font-size: 2em;
      }

      .candidate-result {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      .vote-bar-container {
        width: 100%;
        order: 3;
      }

      .percentage-display {
        order: 4;
      }

      .controls {
        flex-direction: column;
        align-items: center;
      }

      .control-btn {
        width: 100%;
        max-width: 300px;
        justify-content: center;
      }

      .logo img { height: 50px; }

      footer {
        font-size: 0.8rem;
        padding: 10px 0;
      }
    }

    /* Animation delays for candidate results */
    .candidate-result:nth-child(1) { animation-delay: 0.1s; }
    .candidate-result:nth-child(2) { animation-delay: 0.2s; }
    .candidate-result:nth-child(3) { animation-delay: 0.3s; }
    .candidate-result:nth-child(4) { animation-delay: 0.4s; }
    .candidate-result:nth-child(5) { animation-delay: 0.5s; }
  </style>
</head>

<body>
  <!-- Floating Orbs -->
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>

  <!-- Logo -->
  <div class="logo">
    <img src="https://i.imgur.com/3Q1qY7Z.png" alt="NLNG Logo">
  </div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>NLNG Employee Excellence Awards</h1>
      <h2>Voting Results - Admin Dashboard</h2>
    </div>

    <!-- Stats -->
    <div class="stats-container" id="statsContainer">
      <div class="stat-card">
        <div class="stat-number" id="totalVotes">0</div>
        <div class="stat-label">Total Votes</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="totalVoters">0</div>
        <div class="stat-label">Total Voters</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="participationRate">0%</div>
        <div class="stat-label">Participation Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="leadingCategory">-</div>
        <div class="stat-label">Most Competitive</div>
      </div>
    </div>

    <!-- Results Container -->
    <div class="results-container" id="resultsContainer">
      <!-- Results will be dynamically added here -->
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" id="refreshBtn">
        <i class="fas fa-sync-alt"></i> Refresh Results
      </button>
      <button class="control-btn back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i> Back to Voting
      </button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>NLNG Employee Excellence Awards 2023 | Admin Dashboard</p>
  </footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBtCudg-7Z5ZwjCs8XroeOqa2qlvOIOV4w",
      authDomain: "nlng-voting-system.firebaseapp.com",
      databaseURL: "https://nlng-voting-system-default-rtdb.firebaseio.com",
      projectId: "nlng-voting-system",
      storageBucket: "nlng-voting-system.firebasestorage.app",
      messagingSenderId: "851277078103",
      appId: "1:851277078103:web:54066162daafda99470d12",
      measurementId: "G-D6MX1JL08C"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Awards data (same as voting page)
    const awardsData = [
      {
        id: "leadership",
        name: "Leadership Excellence Award",
        icon: "fas fa-trophy",
        candidates: [
          { name: "John Okafor", role: "Senior Manager", img: "https://i.pravatar.cc/150?img=1" },
          { name: "Amina Bello", role: "Department Head", img: "https://i.pravatar.cc/150?img=2" },
          { name: "Chinedu Nwosu", role: "Team Lead", img: "https://i.pravatar.cc/150?img=3" },
          { name: "Grace Eze", role: "Project Manager", img: "https://i.pravatar.cc/150?img=4" }
        ]
      },
      {
        id: "innovation",
        name: "Innovation Award",
        icon: "fas fa-lightbulb",
        candidates: [
          { name: "Emeka Uche", role: "R&D Specialist", img: "https://i.pravatar.cc/150?img=5" },
          { name: "Ifeoma Okeke", role: "Product Developer", img: "https://i.pravatar.cc/150?img=6" },
          { name: "Umar Danladi", role: "Tech Lead", img: "https://i.pravatar.cc/150?img=7" },
          { name: "Ngozi Udo", role: "Innovation Manager", img: "https://i.pravatar.cc/150?img=8" }
        ]
      },
      {
        id: "teamwork",
        name: "Teamwork Award",
        icon: "fas fa-users",
        candidates: [
          { name: "Fatima Ahmed", role: "Team Coordinator", img: "https://i.pravatar.cc/150?img=9" },
          { name: "Samuel Johnson", role: "Collaboration Lead", img: "https://i.pravatar.cc/150?img=10" },
          { name: "Ruth Okon", role: "Project Coordinator", img: "https://i.pravatar.cc/150?img=11" },
          { name: "David Musa", role: "Department Lead", img: "https://i.pravatar.cc/150?img=12" }
        ]
      },
      {
        id: "customer-service",
        name: "Customer Service Excellence",
        icon: "fas fa-headset",
        candidates: [
          { name: "Susan Adebayo", role: "Client Relations", img: "https://i.pravatar.cc/150?img=13" },
          { name: "Michael Okoro", role: "Support Specialist", img: "https://i.pravatar.cc/150?img=14" },
          { name: "Patience Eze", role: "Customer Success", img: "https://i.pravatar.cc/150?img=15" },
          { name: "James Okafor", role: "Service Manager", img: "https://i.pravatar.cc/150?img=16" }
        ]
      },
      {
        id: "safety",
        name: "Safety Excellence Award",
        icon: "fas fa-shield-alt",
        candidates: [
          { name: "Bola Adekunle", role: "Safety Officer", img: "https://i.pravatar.cc/150?img=17" },
          { name: "Tunde Lawal", role: "Compliance Manager", img: "https://i.pravatar.cc/150?img=18" },
          { name: "Chioma Nwankwo", role: "Risk Analyst", img: "https://i.pravatar.cc/150?img=19" },
          { name: "Peter Okon", role: "Safety Coordinator", img: "https://i.pravatar.cc/150?img=20" }
        ]
      }
    ];

    // DOM Elements
    const statsContainer = document.getElementById('statsContainer');
    const totalVotes = document.getElementById('totalVotes');
    const totalVoters = document.getElementById('totalVoters');
    const participationRate = document.getElementById('participationRate');
    const leadingCategory = document.getElementById('leadingCategory');
    const resultsContainer = document.getElementById('resultsContainer');
    const refreshBtn = document.getElementById('refreshBtn');
    const backBtn = document.getElementById('backBtn');

    // State variables
    let resultsData = {};
    let totalVotesCount = 0;

    // Initialize the page
    function initPage() {
      // Check admin authentication
      checkAdminAuth();
      
      // Set up event listeners
      setupEventListeners();
      
      // Load initial results
      loadResults();
    }

    // Check if user is authenticated as admin
    function checkAdminAuth() {
      const password = localStorage.getItem('nlngAdminAuth');
      if (password !== 'NLNG2025') {
        const enteredPassword = prompt('Enter admin password:');
        if (enteredPassword === 'NLNG2025') {
          localStorage.setItem('nlngAdminAuth', 'NLNG2025');
        } else {
          alert('Incorrect password. Access denied.');
          window.location.href = 'index.html';
        }
      }
    }

    // Setup event listeners
    function setupEventListeners() {
      // Refresh button
      refreshBtn.addEventListener('click', () => {
        loadResults();
      });
      
      // Back button
      backBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    // Load results from Firebase
    async function loadResults() {
      try {
        // Get all votes to count total voters
        const votesRef = ref(db, 'votes');
        const votesSnapshot = await get(votesRef);
        const totalVotersCount = votesSnapshot.exists() ? Object.keys(votesSnapshot.val()).length : 0;
        
        totalVoters.textContent = totalVotersCount;
        
        // Get results data
        const resultsRef = ref(db, 'results');
        const resultsSnapshot = await get(resultsRef);
        
        if (resultsSnapshot.exists()) {
          resultsData = resultsSnapshot.val();
          renderResults();
          calculateStats();
        } else {
          resultsContainer.innerHTML = '<p style="text-align: center; padding: 40px; color: var(--accent1);">No votes have been cast yet.</p>';
        }
      } catch (error) {
        console.error("Error loading results:", error);
        alert("Error loading results. Please try again.");
      }
    }

    // Render results
    function renderResults() {
      resultsContainer.innerHTML = '';
      totalVotesCount = 0;
      
      awardsData.forEach(award => {
        const awardResults = document.createElement('div');
        awardResults.className = 'award-results';
        
        const awardResultData = resultsData[award.id] || {};
        const candidatesWithVotes = award.candidates.map(candidate => {
          return {
            ...candidate,
            votes: awardResultData[candidate.name] || 0
          };
        });
        
        // Sort by votes (descending)
        candidatesWithVotes.sort((a, b) => b.votes - a.votes);
        
        // Calculate total votes for this award
        const awardTotalVotes = candidatesWithVotes.reduce((sum, candidate) => sum + candidate.votes, 0);
        totalVotesCount += awardTotalVotes;
        
        // Find winner(s) - there might be ties
        const maxVotes = candidatesWithVotes[0]?.votes || 0;
        const winners = candidatesWithVotes.filter(candidate => candidate.votes === maxVotes && maxVotes > 0);
        
        awardResults.innerHTML = `
          <div class="award-title">
            <i class="${award.icon}"></i>
            <span>${award.name}</span>
            <span style="margin-left: auto; font-size: 0.9em; color: var(--accent2);">Total Votes: ${awardTotalVotes}</span>
          </div>
          <div class="candidate-results" id="candidates-${award.id}">
            <!-- Candidate results will be added here -->
          </div>
        `;
        
        resultsContainer.appendChild(awardResults);
        
        // Render candidate results
        const candidateResults = document.getElementById(`candidates-${award.id}`);
        candidatesWithVotes.forEach(candidate => {
          const isWinner = winners.some(winner => winner.name === candidate.name);
          const percentage = awardTotalVotes > 0 ? ((candidate.votes / awardTotalVotes) * 100).toFixed(1) : 0;
          
          const candidateElement = document.createElement('div');
          candidateElement.className = `candidate-result ${isWinner ? 'winner' : ''}`;
          candidateElement.innerHTML = `
            <img src="${candidate.img}" alt="${candidate.name}" class="candidate-image">
            <div class="candidate-info">
              <div class="candidate-name">${candidate.name}</div>
              <div class="candidate-role">${candidate.role}</div>
            </div>
            <div class="vote-count">${candidate.votes}</div>
            <div class="vote-bar-container">
              <div class="vote-bar" style="width: ${percentage}%"></div>
            </div>
            <div class="percentage-display">${percentage}%</div>
          `;
          
          candidateResults.appendChild(candidateElement);
        });
      });
    }

    // Calculate and display statistics
    function calculateStats() {
      // Update total votes
      totalVotes.textContent = totalVotesCount;
      
      // Calculate participation rate (assuming 500 total employees for demo)
      const totalEmployees = 500;
      const votersCount = parseInt(totalVoters.textContent);
      const rate = ((votersCount / totalEmployees) * 100).toFixed(1);
      participationRate.textContent = `${rate}%`;
      
      // Find most competitive category (highest number of votes)
      let maxVotes = 0;
      let competitiveCategory = '-';
      
      awardsData.forEach(award => {
        const awardResultData = resultsData[award.id] || {};
        const awardTotalVotes = Object.values(awardResultData).reduce((sum, votes) => sum + votes, 0);
        
        if (awardTotalVotes > maxVotes) {
          maxVotes = awardTotalVotes;
          competitiveCategory = award.name;
        }
      });
      
      leadingCategory.textContent = competitiveCategory.length > 15 
        ? competitiveCategory.substring(0, 15) + '...' 
        : competitiveCategory;
    }

    // Initialize the page when loaded
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
