<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🏆 NLNG Award Nomination Form 2025</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
:root {
  --gradient-bg: linear-gradient(135deg, #003f5c, #2f4b7c, #665191, #a05195, #d45087);
  --form-bg: rgba(255, 255, 255, 0.15);
  --input-bg: rgba(255, 255, 255, 0.1);
  --input-focus: #d45087;
  --btn-gradient: linear-gradient(90deg, #00c6ff, #0072ff);
  --accent1: #00ffcc;
  --accent2: #ffcc00;
  --white: #ffffff;
}

/* Reset & Base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
html, body {
  height: 100%;
  background: var(--gradient-bg);
  background-size: 400% 400%;
  animation: bgShift 20s ease infinite;
  color: var(--white);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating light effect */
.orb {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff33, transparent);
  animation: floaty 10s ease-in-out infinite;
  z-index: 0;
}
.orb:nth-child(1){ top: 10%; left: 15%; animation-delay: 0s; }
.orb:nth-child(2){ top: 60%; right: 10%; animation-delay: 2s; }
.orb:nth-child(3){ bottom: 15%; left: 45%; animation-delay: 4s; }

@keyframes floaty {
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-20px); }
}

/* Logo */
.logo {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
}
.logo img {
  height: 65px;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
}

/* Container */
.container {
  background: var(--form-bg);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  width: 80%;
  max-width: 1000px;
  margin: 90px auto 70px auto;
  padding: 40px;
  box-shadow: 0 0 25px rgba(0,0,0,0.3);
  overflow-y: auto;
  max-height: calc(100vh - 180px);
  scrollbar-width: none;
}
.container::-webkit-scrollbar { display: none; }

h1 {
  text-align: center;
  font-size: 2.4rem;
  background: linear-gradient(90deg, #ffcc00, #00ffcc, #00c6ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
p.note {
  text-align: center;
  color: #f0f0f0;
  margin-bottom: 20px;
}

/* Form fields */
label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
}
input, textarea {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--white);
  font-size: 1rem;
  transition: 0.3s;
}
input:focus, textarea:focus {
  outline: none;
  box-shadow: 0 0 10px var(--input-focus);
}

textarea { resize: none; height: 80px; }

.section-title {
  margin-top: 25px;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent1);
  border-bottom: 2px solid rgba(255,255,255,0.2);
  padding-bottom: 5px;
}

.award-section {
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 8px rgba(255,255,255,0.1);
}
.award-section h3 {
  color: var(--accent2);
  margin-bottom: 10px;
}

/* Buttons */
button {
  display: block;
  background: var(--btn-gradient);
  color: #fff;
  border: none;
  border-radius: 35px;
  padding: 15px 40px;
  font-size: 1.1rem;
  font-weight: 600;
  margin: 25px auto 0;
  cursor: pointer;
  transition: 0.3s ease;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0,255,128,0.4);
}

/* Message */
.message {
  text-align: center;
  margin-top: 15px;
  font-weight: 600;
  min-height: 25px;
}

/* Footer */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  text-align: center;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 0.95rem;
  padding: 10px 0;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="logo"><img src="nlng-logo.png" alt="NLNG Logo"></div>
<div class="orb"></div><div class="orb"></div><div class="orb"></div>

<div class="container">
  <h1>🏆 NLNG Award Nomination Form 2025</h1>
  <p class="note">Each nominator can nominate one unique person per award. Please complete all fields carefully.</p>

  <form id="nominationForm">
    <div class="section-title">Nominator Information</div>
    <label>Full Name</label>
    <input type="text" id="nominatorName" required />
    <label>Email Address</label>
    <input type="email" id="nominatorEmail" required />

    <div class="section-title">Award Nominations</div>
    <div id="awardsContainer"></div>

    <button type="submit">Submit Nominations</button>
    <div class="message" id="message"></div>
  </form>
</div>

<footer>© 2025 NLNG | Nomination Portal — All Rights Reserved</footer>

<!-- JS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, push, set, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtCudg-7Z5ZwjCs8XroeOqa2qlvOIOV4w",
  authDomain: "nlng-voting-system.firebaseapp.com",
  databaseURL: "https://nlng-voting-system-default-rtdb.firebaseio.com",
  projectId: "nlng-voting-system",
  storageBucket: "nlng-voting-system.firebasestorage.app",
  messagingSenderId: "851277078103",
  appId: "1:851277078103:web:6b9c5d7cd3a0da80470d12",
  measurementId: "G-V6T773WLN7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ✅ Award List
const awards = [
  "Most Collaborative Unit of the Year", "The Continuous Improvement (CI) Award", "Manager of the Year",
  "Most Inspirational Mentor", "The 'I Got Ya Back' Award", "Most Innovative Award", "Sustainability Award",
  "Integrity Award", "Enterprise First Award", "PM Partner of the Year", "PI Partner of the Year",
  "PS/PG Partner of the Year", "PT Partner of the Year", "PC Partner of the Year", "Operations Partner of the Year",
  "HSE Partner of the Year", "CMO Partner of the Year", "ESD Partner of the Year", "TP Partner of the Year",
  "TE Partner of the Year", "TI/TF Partner of the Year", "IMT Partner of the Year", "CSS Partner of the Year",
  "LSS Partner of the Year", "HRE Partner of the Year"
];

const container = document.getElementById("awardsContainer");
awards.forEach((award, i) => {
  const div = document.createElement("div");
  div.classList.add("award-section");
  div.innerHTML = `
    <h3>${i + 1}. ${award}</h3>
    <label>Nominee Full Name</label>
    <input type="text" name="nomineeName_${i}" required />
    <label>Nominee Department</label>
    <input type="text" name="nomineeDept_${i}" required />
    <label>Justification (Why are you nominating this person?)</label>
    <textarea name="justification_${i}" required></textarea>`;
  container.appendChild(div);
});

// ✅ Integrated submission script
document.getElementById("nominationForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = document.getElementById("message");
  const name = document.getElementById("nominatorName").value.trim();
  const email = document.getElementById("nominatorEmail").value.trim().toLowerCase();

  message.textContent = "⏳ Checking submission status...";
  message.style.color = "white";

  if (!name || !email) {
    message.style.color = "yellow";
    message.textContent = "⚠️ Please fill in your name and email.";
    return;
  }

  // Disable submit button
  const submitBtn = e.target.querySelector("button[type='submit']");
  submitBtn.disabled = true;
  submitBtn.style.opacity = 0.5;

  try {
    const q = query(ref(db, "nominations"), orderByChild("nominatorEmail"), equalTo(email));
    const snap = await get(q);
    if (snap.exists()) {
      message.style.color = "#ff8080";
      message.textContent = "⚠️ You have already submitted your nominations.";
      submitBtn.disabled = false;
      submitBtn.style.opacity = 1;
      return;
    }

    const formData = {};
    awards.forEach((award, i) => {
      formData[`award_${i+1}`] = {
        award,
        nomineeName: document.querySelector(`[name='nomineeName_${i}']`).value.trim(),
        nomineeDept: document.querySelector(`[name='nomineeDept_${i}']`).value.trim(),
        justification: document.querySelector(`[name='justification_${i}']`).value.trim()
      };
    });

    const newRef = push(ref(db, "nominations"));
    await set(newRef, {
      nominatorName: name,
      nominatorEmail: email,
      submissions: formData,
      timestamp: new Date().toISOString()
    });

    message.style.color = "lime";
    message.textContent = "✅ Nomination submitted successfully!";
    setTimeout(() => location.reload(), 2500);

  } catch (err) {
    console.error(err);
    message.style.color = "red";
    message.textContent = "❌ Error submitting nominations.";
    submitBtn.disabled = false;
    submitBtn.style.opacity = 1;
  }
});
</script>
</body>
</html>
