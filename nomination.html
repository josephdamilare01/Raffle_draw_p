<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🏆 NLNG Award Nomination Form 2025</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --gradient-bg: linear-gradient(135deg, #003f5c, #2f4b7c, #665191, #a05195, #d45087);
  --form-bg: rgba(255, 255, 255, 0.15);
  --input-bg: rgba(255, 255, 255, 0.1);
  --input-focus: #d45087;
  --btn-gradient: linear-gradient(90deg, #00c6ff, #0072ff);
  --accent1: #00ffcc;
  --accent2: #ffcc00;
  --white: #ffffff;
}

/* Reset & Base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
html, body {
  height: 100%;
  min-height: 100vh;
  background: var(--gradient-bg);
  background-size: 400% 400%;
  animation: bgShift 20s ease infinite;
  color: var(--white);
  display: flex;
  flex-direction: column;
}

/* Background Animation */
@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating orbs */
.orb {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff33, transparent);
  animation: floaty 10s ease-in-out infinite;
  z-index: 0;
}
.orb:nth-child(1){ top: 10%; left: 15%; animation-delay: 0s; }
.orb:nth-child(2){ top: 60%; right: 10%; animation-delay: 2s; }
.orb:nth-child(3){ bottom: 15%; left: 45%; animation-delay: 4s; }

@keyframes floaty {
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-20px); }
}

/* Logo */
.logo {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
}
.logo img {
  height: 65px;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
  max-width: 100%;
}

/* Container */
.container {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  width: 90%;
  max-width: 1000px;
  margin: 120px auto 50px auto;
  padding: 30px;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
  border-radius: 12px;
  overflow-y: auto;
  max-height: none;
}

/* Headings */
h1 {
  text-align: center;
  font-size: 2rem;
  background: linear-gradient(90deg, #ffcc00, #00ffcc, #00c6ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
p.note {
  text-align: center;
  color: #f0f0f0;
  margin-bottom: 20px;
}

/* Form */
label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
  font-size: 0.95rem;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--white);
  font-size: 1rem;
  transition: 0.3s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  box-shadow: 0 0 10px var(--input-focus);
}
textarea { resize: none; height: 80px; }

.section-title {
  margin-top: 25px;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent1);
  border-bottom: 2px solid rgba(255,255,255,0.2);
  padding-bottom: 5px;
}

.award-section {
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 8px rgba(255,255,255,0.1);
}
.award-section h3 {
  color: var(--accent2);
  margin-bottom: 10px;
}

/* Buttons */
button {
  display: block;
  background: var(--btn-gradient);
  color: #fff;
  border: none;
  border-radius: 35px;
  padding: 15px 40px;
  font-size: 1rem;
  font-weight: 600;
  margin: 25px auto 0;
  cursor: pointer;
  transition: 0.3s ease;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0,255,128,0.4);
}

/* Message */
.message {
  text-align: center;
  margin-top: 15px;
  font-weight: 600;
  min-height: 25px;
}

/* Footer */
footer {
  margin-top: auto;
  width: 100%;
  text-align: center;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 0.9rem;
  padding: 15px 0;
  letter-spacing: 0.5px;
  position: relative;
}

/* Responsive */
@media (max-width: 768px) {
  .container {
    width: 95%;
    margin: 90px auto 30px auto;
    padding: 20px;
    max-height: none;
  }

  h1 {
    font-size: 1.5rem;
    line-height: 1.4;
  }

  input, select, textarea {
    font-size: 0.95rem;
    padding: 10px;
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
  }

  .logo img { height: 50px; }

  footer {
    font-size: 0.8rem;
    padding: 10px 0;
  }
}
</style>
</head>
<body>

<div class="logo"><img src="nlng-logo.png" alt="NLNG Logo"></div>
<div class="orb"></div><div class="orb"></div><div class="orb"></div>

<div class="container">
  <h1>🏆 NLNG Award Nomination Form 2025</h1>
  <p class="note">Each nominator can nominate one unique person per award. Please complete all fields carefully.</p>

  <form id="nominationForm">
    <div class="section-title">Nominator Information</div>
    <label>First Name</label>
    <input type="text" id="nominatorFirstName" required />
    <label>Last Name</label>
    <input type="text" id="nominatorLastName" required />
     <label>Department</label>
    <input type="text" id="nominatorDepart" required />
    <label>Email Address (For company Email with @nlng, @Nsml.com, and @raisbny.com only)</label>
    <input type="email" id="nominatorEmail" placeholder="e.g. jane@nlng.com" />

    <label>Employee Number (if no company email)</label>
    <input type="text" id="employeeNumber" placeholder="Enter employee number if no email" />


    <div class="section-title">Award Nominations</div>
    <div id="awardsContainer"></div>

    <button type="submit">Submit Nominations</button>
    <div class="message" id="message"></div>
  </form>
</div>

<footer>© 2025 NLNG | Nomination Portal — All Rights Reserved</footer>

<!-- JS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, push, set, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyBtCudg-7Z5ZwjCs8XroeOqa2qlvOIOV4w",
  authDomain: "nlng-voting-system.firebaseapp.com",
  databaseURL: "https://nlng-voting-system-default-rtdb.firebaseio.com",
  projectId: "nlng-voting-system",
  storageBucket: "nlng-voting-system.firebasestorage.app",
  messagingSenderId: "851277078103",
  appId: "1:851277078103:web:6b9c5d7cd3a0da80470d12",
  measurementId: "G-V6T773WLN7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
// --- Award Descriptions ---
  
const awardDescriptions = {
  "Most Collaborative Dept of the Year": "A department that prioritizes the overall company objective and go above and beyond to collaboratively achieve this. They collectively exemplify the NLNG core values, are accommodating, are always ready to support other teams, even going the extra mile.",
  "The Continuous Improvement Team (CIT) Award": "A team(unit) known for always seeking improvements. They are adaptive, innovative, ready to try new things safely and simplify business processes.",
  "Manager of the Year": "A manager who has been excellent in leadership. The winner should be someone known for building high performing teams and people. His/her team should be confident and creative, have a high degree of ownership and accountability.",
  "Most Inspirational Mentor": "A leader who grows people. He or she should have several past and present mentees and have an open-door policy.",
  "The 'I Got Ya Back' Award": "A line head who support personnel within or outside their teams even in seemingly negative situations. He/she is positive and people builder.",
  "Most Innovative Award": "An individual known for improving and generating new and better ways of working. He/She is visionary, resourceful and selfless",
  "Sustainability Award": "(delivers excellently while striking vital balance to work and life). An individual who work in a sustainable manner. He/She delivers excellently on their task, participates actively in community development, and do not work excessively long hours.",
  "Integrity Award": "An individual who is honest, principled, and fact based etc..",
  "Enterprise First Award": "An individual who puts company objective first above individual team and personal objectives. He/She is flexible, willing to intervene, and easy to work with..",
  "PM Partner of the Year": "A partner staff in the PM department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work..",
  "PI Partner of the Year": "A partner staff in the PI department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work..",
  "PS/PG Partner of the Year": "A partner staff in the PS/PG department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work..",
  "PT Partner of the Year": "A partner staff in PT department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "PC Partner of the Year": "A partner staff in PC department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "Operations Partner of the Year": "A partner staff in PO department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "HSE Partner of the Year": "A partner staff in HSE department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "CMO Partner of the Year": "A partner staff in the CMO department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "ESD Partner of the Year": "ESD Partner of the Year Award. A partner staff in ESD department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "TP Partner of the Year": "A partner staff in the TP department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "TE Partner of the Year": "A partner staff in the TE department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "TI/TF Partner of the Year": "A partner staff in the TI/TF department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "IMT Partner of the Year": "A partner staff in IMT department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "CSS Partner of the Year": "A partner staff in CSS department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "LSS Partner of the Year": "A Partner in LSS department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "CPM Partner of the Year Award": "A staff in CPM department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "NT Partner of the Year Award": "A staff in NT department who has been excellent in safety, has a high sense of accountability, delivers high quality work and maintains a heathy relationship at work.",
  "HR Partner of the Year": "A partner staff in HR who has a high sense of accountability, delivers high quality work, and maintains a heathy relationship at work."
};

// --- Awards ---
const awards = [
  "Most Collaborative Dept of the Year", "The Continuous Improvement Team (CIT) Award", "Manager of the Year",
  "Most Inspirational Mentor", "The 'I Got Ya Back' Award", "Most Innovative Award", "Sustainability Award",
  "Integrity Award", "Enterprise First Award", "PM Partner of the Year", "PI Partner of the Year",
  "PS/PG Partner of the Year", "PT Partner of the Year", "PC Partner of the Year", "Operations Partner of the Year",
  "HSE Partner of the Year", "CMO Partner of the Year", "ESD Partner of the Year", "TP Partner of the Year",
  "TE Partner of the Year", "TI/TF Partner of the Year", "IMT Partner of the Year", "CSS Partner of the Year",
  "LSS Partner of the Year", "CPM Partner of the Year Award", "NT Partner of the Year Award", "HR Partner of the Year"
];

// Ask the user if they want to change them
const departments = ["Operations", "Human Resources", "Finance", "Technical Services", "Corporate Affairs"];
const managers = ["James Okon", "Patricia Balogun", "Emeka Nwosu", "Linda Eze", "Tunde Bamidele"];
const container = document.getElementById("awardsContainer");

// --- Load staff list (JSON) ---
let staffList = [];
fetch("candidates.json")
  .then(res => res.json())
  .then(data => {
    staffList = data;
    console.log("✅ Staff list loaded:", staffList.length, "records");
  })
  .catch(err => console.error("Error loading staff list:", err));

// --- Render Awards ---
// --- Render Awards ---
awards.forEach((award, i) => {
  const div = document.createElement("div");
  div.classList.add("award-section");
  let inputField = "";

  if (award === "Manager of the Year") {
    // Only manager name input
    inputField = `
      <label>Manager's Name</label>
      <input type="text" name="nomineeName_${i}" placeholder="Enter manager's full name" required />
      <label>Department</label>
      <input type="text" name="nomineeDept_${i}" placeholder="Enter manager's Department" required />
    `;   
  } else if (award === "Most Collaborative Dept of the Year") {
    // Only department name input
    inputField = `
      <label>Department Name</label>
      <input type="text" name="nomineeDept_${i}" placeholder="Enter department name" required />
    `;
  } else if (award === "The Continuous Improvement Team (CIT) Award") {
    // Only department name input
    inputField = `
      <label>Team (Unit) Name</label>
      <input type="text" name="nomineeDept_${i}" placeholder="Enter team (Unit) name" required />
    `;
  }
  else {
    inputField = `
      <label>Nominee</label>
      <input type="text" list="candidateList_${i}" name="nomineeName_${i}" placeholder="Type candidate name..." autocomplete="off" required>
      <datalist id="candidateList_${i}"></datalist>
      <label>Department</label>
      <input type="text" name="nomineeDept_${i}" readonly />
      <label>Company</label>
      <input type="text" name="nomineeCompany_${i}" readonly />
      <label>Status</label>
      <input type="text" name="nomineestatus_${i}" readonly />
    `;
  }

  div.innerHTML = `<h3>${i + 1}. ${award}</h3>
    <p style="color:#ccc; font-size:0.9rem; margin-bottom:10px;">
      ${awardDescriptions[award] || ""}
    </p>${inputField}`;
  container.appendChild(div);
});

// --- Dynamic Autocomplete ---
container.addEventListener("input", (e) => {
  if (!e.target.name?.startsWith("nomineeName_")) return;
  const input = e.target;
  const datalist = document.getElementById(input.getAttribute("list"));
  const value = input.value.toLowerCase();

  datalist.innerHTML = "";
  if (value.length < 2) return;

  const filtered = staffList
    .filter(person =>
      person["Employee Name"].toLowerCase().includes(value)
    )
    .slice(0, 20);

  filtered.forEach(person => {
    const option = document.createElement("option");
    option.value = person["Employee Name"];
    datalist.appendChild(option);
  });
});

// --- Autofill other fields ---
container.addEventListener("change", (e) => {
  if (!e.target.name?.startsWith("nomineeName_")) return;
  const input = e.target;
  const index = input.name.split("_")[1];

  const selected = staffList.find(p => p["Employee Name"] === input.value);

  if (selected) {
    document.querySelector(`[name='nomineeDept_${index}']`).value = selected["Department"];
    document.querySelector(`[name='nomineeCompany_${index}']`).value = selected["Company"];
    document.querySelector(`[name='nomineestatus_${index}']`).value = selected["Status"];
  }
});
// --- Submit to Firebase ---
document.getElementById("nominationForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = document.getElementById("message");
  const submitBtn = e.target.querySelector("button[type='submit']");
  submitBtn.disabled = true;
  submitBtn.style.opacity = 0.5;

  const firstName = document.getElementById("nominatorFirstName").value.trim();
  const lastName = document.getElementById("nominatorLastName").value.trim();
  const department = document.getElementById("nominatorDepart").value.trim();
  const email = document.getElementById("nominatorEmail").value.trim().toLowerCase();
  const employeeNumber = document.getElementById("employeeNumber").value.trim();

  const validDomains = ["nlng.com", "nsml.com", "raisbny.com"];
  const emailDomain = email.includes("@") ? email.split("@")[1] : "";

  // ✅ Validation: Must have either valid email OR employee number
  if (!((email && validDomains.includes(emailDomain)) || employeeNumber)) {
    message.textContent = "⚠️ Please enter a valid company email or your employee number.";
    message.style.color = "yellow";
    submitBtn.disabled = false;
    submitBtn.style.opacity = 1;
    return;
  }

  message.textContent = "⏳ Submitting nomination...";
  message.style.color = "white";

  const uniqueKey = `${firstName.toLowerCase()}_${lastName.toLowerCase()}_${department.toLowerCase()}_${email || employeeNumber}`;

  try {
    // Check for existing submission
    const q = query(ref(db, "nominations"), orderByChild("uniqueKey"), equalTo(uniqueKey));
    const snap = await get(q);

    if (snap.exists()) {
      message.style.color = "#ff8080";
      message.textContent = "⚠️ You have already submitted nominations.";
      submitBtn.disabled = false;
      submitBtn.style.opacity = 1;
      return;
    }

    // Prepare submission
    const formData = {};
    awards.forEach((award, i) => {
      formData[`award_${i + 1}`] = {
        award,
        nomineeName: document.querySelector(`[name='nomineeName_${i}']`)?.value || "",
        nomineeDept: document.querySelector(`[name='nomineeDept_${i}']`)?.value || "",
        nomineeCompany: document.querySelector(`[name='nomineeCompany_${i}']`)?.value || "",
        nomineestatus: document.querySelector(`[name='nomineestatus_${i}']`)?.value || ""
      };
    });

    // Push to Firebase
    const newRef = push(ref(db, "nominations"));
    await set(newRef, {
      nominatorFirstName: firstName,
      nominatorLastName: lastName,
      nominatorDepart: department,
      nominatorEmail: email || "",
      employeeNumber: employeeNumber || "",
      uniqueKey,
      submissions: formData,
      timestamp: new Date().toISOString()
    });

    message.style.color = "lime";
    message.textContent = "✅ Nomination submitted successfully!";
    setTimeout(() => window.location.href = "thankyou.html", 2000);

  } catch (err) {
    console.error(err);
    message.style.color = "red";
    message.textContent = "❌ Error submitting nominations.";
    submitBtn.disabled = false;
    submitBtn.style.opacity = 1;
  }
});
</script>
</body>
</html>
