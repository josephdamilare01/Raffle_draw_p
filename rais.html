<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🏆 NLNG Award Voting Form 2025 - RAIS</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --gradient-bg: linear-gradient(135deg, #003f5c, #2f4b7c, #665191, #a05195, #d45087);
  --form-bg: rgba(255, 255, 255, 0.15);
  --input-bg: rgba(255, 255, 255, 0.1);
  --input-focus: #d45087;
  --btn-gradient: linear-gradient(90deg, #00c6ff, #0072ff);
  --accent1: #00ffcc;
  --accent2: #ffcc00;
  --white: #ffffff;
}

/* Reset & Base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
html, body {
  height: 100%;
  min-height: 100vh;
  background: var(--gradient-bg);
  background-size: 400% 400%;
  animation: bgShift 20s ease infinite;
  color: var(--white);
  display: flex;
  flex-direction: column;
}

/* Background Animation */
@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Floating orbs */
.orb {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff33, transparent);
  animation: floaty 10s ease-in-out infinite;
  z-index: 0;
}
.orb:nth-child(1){ top: 10%; left: 15%; animation-delay: 0s; }
.orb:nth-child(2){ top: 60%; right: 10%; animation-delay: 2s; }
.orb:nth-child(3){ bottom: 15%; left: 45%; animation-delay: 4s; }

@keyframes floaty {
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-20px); }
}

/* Logo */
.logo {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 10;
}
.logo img {
  height: 65px;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
  max-width: 100%;
}

/* Container */
.container {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  width: 90%;
  max-width: 1000px;
  margin: 120px auto 50px auto;
  padding: 30px;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
  border-radius: 12px;
  overflow-y: auto;
  max-height: none;
}

/* Headings */
h1 {
  text-align: center;
  font-size: 2rem;
  background: linear-gradient(90deg, #ffcc00, #00ffcc, #00c6ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
p.note {
  text-align: center;
  color: #f0f0f0;
  margin-bottom: 20px;
}

/* Date Info Banner */
.date-info {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  text-align: center;
  backdrop-filter: blur(5px);
}
.date-info p {
  margin: 5px 0;
  font-size: 0.95rem;
}
.date-info .date-open {
  color: #00ffcc;
  font-weight: 600;
}
.date-info .date-close {
  color: #ffcc00;
  font-weight: 600;
}
.date-info .date-closed {
  color: #ff6b6b;
  font-weight: 600;
  background: rgba(255, 107, 107, 0.2);
  padding: 8px 15px;
  border-radius: 20px;
  display: inline-block;
  margin-top: 5px;
}

/* Form */
label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
  font-size: 0.95rem;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: var(--input-bg);
  color: var(--white);
  font-size: 1rem;
  transition: 0.3s;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  box-shadow: 0 0 10px var(--input-focus);
}
textarea { resize: none; height: 80px; }

.section-title {
  margin-top: 25px;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent1);
  border-bottom: 2px solid rgba(255,255,255,0.2);
  padding-bottom: 5px;
}

.award-section {
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 8px rgba(255,255,255,0.1);
}
.award-section h3 {
  color: var(--accent2);
  margin-bottom: 10px;
}

/* Buttons */
button {
  display: block;
  background: var(--btn-gradient);
  color: #fff;
  border: none;
  border-radius: 35px;
  padding: 15px 40px;
  font-size: 1rem;
  font-weight: 600;
  margin: 25px auto 0;
  cursor: pointer;
  transition: 0.3s ease;
}
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0,255,128,0.4);
}
button:disabled {
  background: #666;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
  opacity: 0.6;
}

/* Message */
.message {
  text-align: center;
  margin-top: 15px;
  font-weight: 600;
  min-height: 25px;
}

/* Footer */
footer {
  margin-top: auto;
  width: 100%;
  text-align: center;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 0.9rem;
  padding: 15px 0;
  letter-spacing: 0.5px;
  position: relative;
}

/* Responsive */
@media (max-width: 768px) {
  .container {
    width: 95%;
    margin: 90px auto 30px auto;
    padding: 20px;
    max-height: none;
  }

  h1 {
    font-size: 1.5rem;
    line-height: 1.4;
  }

  input, select, textarea {
    font-size: 0.95rem;
    padding: 10px;
  }

  button {
    width: 100%;
    padding: 14px;
    border-radius: 30px;
  }

  .logo img { height: 50px; }

  footer {
    font-size: 0.8rem;
    padding: 10px 0;
  }
}
</style>
</head>
<body>

<div class="logo"><img src="nlng-logo.png" alt="NLNG Logo"></div>
<div class="orb"></div><div class="orb"></div><div class="orb"></div>

<div class="container">
  <h1>🏆 NLNG Award Voting Form 2025 - RAIS</h1>
  <p class="note">You can only vote for one unique person. Please complete all fields carefully..</p>

  <!-- Date Information Banner -->
  <div class="date-info" id="dateInfo">
    <p>Voting Period: <span class="date-open" id="startDateDisplay">Loading...</span> to <span class="date-close" id="closeDateDisplay">Loading...</span></p>
    <p id="VotingStatus"></p>
  </div>

  <form id="VotingForm">
    <div class="section-title">Nominator Information</div>
    <label>First Name</label>
    <input type="text" id="nominatorFirstName" required />
    <label>Last Name</label>
    <input type="text" id="nominatorLastName" required />
     <label>Department</label>
    <input type="text" id="nominatorDepart" required />
    <label>Email Address (For company Email with @nlng, @Nsml.com, and @raisbny.com only)</label>
    <input type="email" id="nominatorEmail" placeholder="e.g. jane@nlng.com" />

    <label>Employee Number (for Partner personnel without company email address)</label>
    <input type="text" id="employeeNumber" placeholder="Enter employee number if no email" />


    <div class="section-title"></div>
    <div id="awardsContainer"></div>

    <button type="submit" id="submitButton">Submit Your Votes</button>
    <div class="message" id="message"></div>
  </form>
</div>

<footer>© 2025 NLNG | Voting Portal — All Rights Reserved</footer>

<!-- JS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, push, set, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyBtCudg-7Z5ZwjCs8XroeOqa2qlvOIOV4w",
  authDomain: "nlng-voting-system.firebaseapp.com",
  databaseURL: "https://nlng-voting-system-default-rtdb.firebaseio.com",
  projectId: "nlng-voting-system",
  storageBucket: "nlng-voting-system.firebasestorage.app",
  messagingSenderId: "851277078103",
  appId: "1:851277078103:web:6b9c5d7cd3a0da80470d12",
  measurementId: "G-V6T773WLN7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- Date Configuration ---
const VotingDates = {
  startDate: new Date('2025-12-08T00:00:00'), // Set your start date here
  closeDate: new Date('2025-12-11T23:23:59')  // Set your close date here
};

// --- Date Display and Validation ---
function updateDateDisplay() {
  const startDateDisplay = document.getElementById('startDateDisplay');
  const closeDateDisplay = document.getElementById('closeDateDisplay');
  const VotingStatus = document.getElementById('VotingStatus');
  const submitButton = document.getElementById('submitButton');
  const form = document.getElementById('VotingForm');

  // Format dates for display
  const options = { year: 'numeric', month: 'long', day: 'numeric' };
  startDateDisplay.textContent = VotingDates.startDate.toLocaleDateString('en-US', options);
  closeDateDisplay.textContent = VotingDates.closeDate.toLocaleDateString('en-US', options);

  const now = new Date();
  
  if (now < VotingDates.startDate) {
    // Votings haven't started yet
    VotingStatus.innerHTML = `<span class="date-closed">Votings open on ${VotingDates.startDate.toLocaleDateString('en-US', options)}</span>`;
    submitButton.disabled = true;
    form.style.opacity = '0.6';
    form.style.pointerEvents = 'none';
  } else if (now > VotingDates.closeDate) {
    // Votings have closed
    VotingStatus.innerHTML = `<span class="date-closed">Votings are now closed</span>`;
    submitButton.disabled = true;
    form.style.opacity = '0.6';
    form.style.pointerEvents = 'none';
  } else {
    // Votings are open
    const daysLeft = Math.ceil((VotingDates.closeDate - now) / (1000 * 60 * 60 * 24));
    VotingStatus.textContent = `Votings are OPEN! ${daysLeft} days remaining`;
    VotingStatus.style.color = '#00ffcc';
    submitButton.disabled = false;
    form.style.opacity = '1';
    form.style.pointerEvents = 'auto';
  }
}

// Initialize date display
updateDateDisplay();

// --- Award Descriptions ---
  
const awardDescriptions = {
  "RAIS Staff of the Year": "A staff in the school who demonstrates strong accountability, consistently delivers high-quality work, and fosters healthy, respectful relationships with both parents and pupils. Creates a supportive learning environment, communicates openly and professionally.",
};

// --- Awards ---
const awards = [
  "RAIS Staff of the Year"
];

// Ask the user if they want to change them
const departments = ["Operations", "Human Resources", "Finance", "Technical Services", "Corporate Affairs"];
const managers = ["James Okon", "Patricia Balogun", "Emeka Nwosu", "Linda Eze", "Tunde Bamidele"];
const container = document.getElementById("awardsContainer");

// --- Load staff list (JSON) ---
let staffList = [];
fetch("candidates_2.json")
  .then(res => res.json())
  .then(data => {
    staffList = data;
    console.log("✅ Staff list loaded:", staffList.length, "records");
  })
  .catch(err => console.error("Error loading staff list:", err));

// --- Render Awards ---
// --- Render Awards ---
awards.forEach((award, i) => {
  const div = document.createElement("div");
  div.classList.add("award-section");
  let inputField = "";

  if (award === "Manager of the Year") {
    // Only manager name input
    inputField = `
      <label>Manager's Name</label>
      <input type="text" name="nomineeName_${i}" placeholder="Enter manager's full name" />
      <label>Department</label>
      <input type="text" name="nomineeDept_${i}" placeholder="Enter manager's Department" />
    `;   
  } else if (award === "Most Collaborative Dept of the Year") {
    // Only department name input
    inputField = `
      <label>Department Name</label>
      <input type="text" name="nomineeDept_${i}" placeholder="Enter department name" />
    `;
  } else if (award === "The Continuous Improvement Team (CIT) Award") {
    // Only department name input
    inputField = `
      <label>Team (Unit) Name</label>
      <input type="text" name="nomineeDept_${i}" placeholder="Enter team (Unit) name" />
    `;
  }
  else {
    inputField = `
      <label>Nominee</label>
      <input type="text" list="candidateList_${i}" name="nomineeName_${i}" placeholder="Type candidate name..." autocomplete="off" >
      <datalist id="candidateList_${i}"></datalist>
      <label>Department</label>
      <input type="text" name="nomineeDept_${i}" readonly />
      <label>Company</label>
      <input type="text" name="nomineeCompany_${i}" readonly />
      <label>Status</label>
      <input type="text" name="nomineestatus_${i}" readonly />
    `;
  }

  div.innerHTML = `<h3>${award}</h3>
    <p style="color:#ccc; font-size:0.9rem; margin-bottom:10px;">
      ${awardDescriptions[award] || ""}
    </p>${inputField}`;
  container.appendChild(div);
});

// --- Dynamic Autocomplete ---
container.addEventListener("input", (e) => {
  if (!e.target.name?.startsWith("nomineeName_")) return;
  const input = e.target;
  const datalist = document.getElementById(input.getAttribute("list"));
  const value = input.value.toLowerCase();

  datalist.innerHTML = "";
  if (value.length < 2) return;

  const filtered = staffList
    .filter(person =>
      person["Employee Name"].toLowerCase().includes(value)
    )
    .slice(0, 20);

  filtered.forEach(person => {
    const option = document.createElement("option");
    option.value = person["Employee Name"];
    datalist.appendChild(option);
  });
});

// --- Autofill other fields ---
container.addEventListener("change", (e) => {
  if (!e.target.name?.startsWith("nomineeName_")) return;
  const input = e.target;
  const index = input.name.split("_")[1];

  const selected = staffList.find(p => p["Employee Name"] === input.value);

  if (selected) {
    document.querySelector(`[name='nomineeDept_${index}']`).value = selected["Department"];
    document.querySelector(`[name='nomineeCompany_${index}']`).value = selected["Company"];
    document.querySelector(`[name='nomineestatus_${index}']`).value = selected["Status"];
  }
});

// --- Submit to Firebase ---
document.getElementById("VotingForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  // Check if Votings are open
  const now = new Date();
  if (now < VotingDates.startDate || now > VotingDates.closeDate) {
    document.getElementById('message').textContent = "❌ Votings are currently closed.";
    document.getElementById('message').style.color = "red";
    return;
  }

  const message = document.getElementById("message");
  const submitBtn = e.target.querySelector("button[type='submit']");
  submitBtn.disabled = true;
  submitBtn.style.opacity = 0.5;

  const firstName = document.getElementById("nominatorFirstName").value.trim();
  const lastName = document.getElementById("nominatorLastName").value.trim();
  const department = document.getElementById("nominatorDepart").value.trim();
  const email = document.getElementById("nominatorEmail").value.trim().toLowerCase();
  const employeeNumber = document.getElementById("employeeNumber").value.trim();

  const validDomains = ["nlng.com", "nsml.com", "raisbny.com"];
  const emailDomain = email.includes("@") ? email.split("@")[1] : "";

  // ✅ Validation: Must have either valid email OR employee number
  if (!((email && validDomains.includes(emailDomain)) || employeeNumber)) {
    message.textContent = "⚠️ Please enter a valid company email or your employee number.";
    message.style.color = "yellow";
    submitBtn.disabled = false;
    submitBtn.style.opacity = 1;
    return;
  }

  message.textContent = "⏳ Submitting Voting...";
  message.style.color = "white";

  const uniqueKey = `${firstName.toLowerCase()}_${lastName.toLowerCase()}_${department.toLowerCase()}_${email || employeeNumber}`;

  try {
    // Check for existing submission
    const q = query(ref(db, "Votings"), orderByChild("uniqueKey"), equalTo(uniqueKey));
    const snap = await get(q);

    if (snap.exists()) {
      message.style.color = "#ff8080";
      message.textContent = "⚠️ You have already submitted Votings.";
      submitBtn.disabled = false;
      submitBtn.style.opacity = 1;
      return;
    }

    // Prepare submission
    const formData = {};
    awards.forEach((award, i) => {
      formData[`award_${i + 1}`] = {
        award,
        nomineeName: document.querySelector(`[name='nomineeName_${i}']`)?.value || "",
        nomineeDept: document.querySelector(`[name='nomineeDept_${i}']`)?.value || "",
        nomineeCompany: document.querySelector(`[name='nomineeCompany_${i}']`)?.value || "",
        nomineestatus: document.querySelector(`[name='nomineestatus_${i}']`)?.value || ""
      };
    });

    // Push to Firebase
    const newRef = push(ref(db, "Votings"));
    await set(newRef, {
      nominatorFirstName: firstName,
      nominatorLastName: lastName,
      nominatorDepart: department,
      nominatorEmail: email || "",
      employeeNumber: employeeNumber || "",
      uniqueKey,
      submissions: formData,
      timestamp: new Date().toISOString()
    });

    message.style.color = "lime";
    message.textContent = "✅ Voting submitted successfully!";
    setTimeout(() => window.location.href = "thankyou.html", 2000);

  } catch (err) {
    console.error(err);
    message.style.color = "red";
    message.textContent = "❌ Error submitting Votings.";
    submitBtn.disabled = false;
    submitBtn.style.opacity = 1;
  }
});
</script>
</body>
</html>
