<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎁 Animated Raffle Draw</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent1: #00c6ff;
            --accent2: #0072ff;
            --accent3: #00ff80;
            --dark: #071428;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin: 10px 0 16px;
            font-size: 5rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent1), var(--accent3), #ffd166);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 100%;
            animation: gradientMove 6s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px 0 60px;
            align-items: stretch;
        }

        .top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-direction: column;
        }

        /* Table container (kept for structure, but table itself is hidden) */
        .left {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 90px;
            border-collapse: collapse;
            background: rgba(255,255,255,0.98);
            color: #000;
            font-size: 2rem;
            border-radius: 10px;
            overflow: hidden;
            table-layout: fixed;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            word-break: break-word;
        }

        thead th {
            background: linear-gradient(90deg, var(--accent2), #005bb5);
            color: #fff;
            font-weight: 600;
        }

        /* ➡️ IMPROVEMENT 1: Increased max-width for prominence */
        .winner-card {
            width: 100%;
            max-width: 800px; 
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.9));
            color: #000;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            position: relative;
            overflow: visible;
            display: none;
            animation: popIn 700ms ease;
            margin: 0 auto;
        }

        .winner-name {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(90deg,var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .division-name, .id-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #004aad;
            margin-bottom: 8px;
        }

        .gift-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e63946;
        }

        /* ➡️ IMPROVEMENT 2: Increased size for gift image */
        .gift-image-wrap {
            margin-top: 20px;
            height: 250px; 
            display:flex;
            justify-content:center;
            align-items:center;
            position: relative;
            overflow: visible;
        }

        .gift-image {
            max-height: 240px; /* Increased max height */
            max-width: 400px; /* Increased max width */
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.35);
            transform-origin: center;
            opacity: 0;
        }

        /* animation for image entering */
        @keyframes moveIn {
            0% { transform: translateY(40px) scale(0.9) rotate(-6deg); opacity: 0; }
            60% { transform: translateY(-6px) scale(1.04) rotate(2deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        /* animation for image leaving */
        @keyframes moveOut {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-40px) scale(0.9) rotate(6deg); opacity: 0; }
        }

        /* NEW: Animation for continuous subtle floating */
        @keyframes floatHorizontal {
            0% { transform: translateX(0px); }
            50% { transform: translateX(8px); }
            100% { transform: translateX(0px); }
        }

        .entering {
            animation: moveIn 700ms ease forwards;
        }
        .leaving {
            animation: moveOut 500ms ease forwards;
        }
        .floating { /* NEW class for continuous floating */
            animation: floatHorizontal 4s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            60% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); }
        }

        .btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
            align-items:center;
        }

        .btn {
            background: linear-gradient(90deg,var(--accent2),var(--accent1));
            border: none;
            color: #00151f;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform .14s ease, box-shadow .14s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.26);
        }

        #loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 20, 40, 0.95);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 10rem;
            font-weight: 700;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .winner-card { max-width: 100%; padding: 18px; }
            th, td { font-size: 0.95rem; padding: 10px 8px; }
            #loader { font-size: 3rem; }
        }

        #doneMessage {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #00c6ff, #00ff80, #ffd166);
            color: #00151f;
            font-size: 3rem;
            font-weight: 800;
            padding: 25px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            animation: popUp 1s ease forwards, fadeOut 3s 4s forwards;
            z-index: 2000;
            letter-spacing: 2px;
        }

        /* department gallery */
        /* --- SLIDER STYLING --- */
        #giftSliderContainer {
            width: 100%;
            max-width: 800px;
            margin: 12px auto 8px;
            position: relative;
            padding: 0 40px; /* Space for controls */
        }
        .slider-wrapper {
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
        .slider-track {
            display: flex;
            transition: transform 0.3s ease-in-out;
        }
        .slider-item {
            flex: 0 0 33.333%; /* Show 3 items */
            padding: 10px 5px;
            box-sizing: border-box;
            opacity: 0.6;
            transition: opacity 0.3s ease;
            cursor: pointer;
            text-align: center;
        }
        .slider-item.active {
            opacity: 1;
            transform: scale(1.1);
        }
        .slider-item img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .slider-item.active img {
             /* Add a glow to the active item */
            box-shadow: 0 0 15px var(--accent3), 0 4px 10px rgba(0,0,0,0.3); 
            transform: scale(1.05);
        }

        .slider-control {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 50;
            opacity: 0.8;
            transition: opacity 0.3s, background 0.3s;
        }
        .slider-control:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.2);
        }
        #prevBtn { left: 0; }
        #nextBtn { right: 0; }
        
        .gallery-label {
            font-size: 0.9rem;
            margin-top: 4px;
            color: #ddd;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 100%;
            display: block;
        }

        /* --- NLNG Logo Styling --- */
        .logo {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 8px var(--nlng-yellow));
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -60%) scale(0.7); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</head>

<body>
    <div class="logo">
        <img src="nlng-logo.png" alt="NLNG Company Logo">
    </div>

    <main class="content">
        <h1>🎊 NLNG End of the Year Raffle Draw</h1>

        <div class="top">
            <div class="right">
                <div class="winner-card" id="winnerCard" aria-live="polite">
                    <div class="winner-name" id="winnerName">🎁 Gift Preview / 🏆 Winner Name</div>
                    <div class="id-name" id="idNumber">🪪 ID Card Number</div>
                    <div class="division-name" id="divisionName">🏢 Division</div>
                    <div class="gift-name" id="giftName">🎁 Gift Name</div>

                    <div class="gift-image-wrap">
                        <img id="giftImage" class="gift-image" src="" alt="Gift image">
                    </div>
                </div>

                <div class="btns" role="group" aria-label="Raffle Draw Controls">
                    <select id="departmentSelect" class="input-control" aria-label="Filter by Department"; padding:10px;border-radius:10px;font-size:1.2rem;">
                        <option value="">Select Department (All)</option>
                    </select>

                    <input type="number" id="maxDrawsInput" class="input-control" value="1" min="1" placeholder="Draw Count" aria-label="Number of draws to perform";style="background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.12); padding: 10px; border-radius: 10px; font-size: 1.2rem; width: 150px; text-align: center;">

                    <button class="btn" id="startDraw">Start Draw</button>
                    <button class="btn" id="restartBtn">Restart</button>
                    <button class="btn" id="homeBtn">🏠 Home</button>
                </div>
            </div>
        </div>
        
        <div class="left">
            <h3>🎁 Gift Preview Slider (Filter: <span id="currentDeptDisplay">All</span>)</h3>
            <div id="giftSliderContainer">
                <button class="slider-control" id="prevBtn" aria-label="Previous Gift">&lt;</button>
                <div class="slider-wrapper">
                    <div class="slider-track" id="sliderTrack">
                        </div>
                </div>
                <button class="slider-control" id="nextBtn" aria-label="Next Gift">&gt;</button>
            </div>


            <h3 style="margin-top:18px;">🎁 Winners Table</h3>
            <table id="resultTable" aria-live="polite" style="display:none;">
                <thead>
                    <tr>
                        <th style="width:6%;">#</th>
                        <th style="width:28%;">Participant Name</th>
                        <th style="width:20%;">ID Card No.</th>
                        <th style="width:26%;">Division</th>
                        <th style="width:20%;">Gift</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>
    <div id="loader">10</div>
    <div id="doneMessage" style="display: none;">Draw Complete!</div>
<script>
    // --- Start of Hardcoded Gift Data (USED ONLY FOR DISPLAY/PREVIEW SELECTOR) ---
    // NOTE: This array is now the single source of truth for display images.
    const giftsDisplayData = [
        // PM Partners
        { name: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100", department: "PM Partners", image: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100.jpg" },

        { name: "hp elitebook x360 touch intel core i5- 16gb ram 1tb ssd backlit keyboard fp reader wins 11 pro +bag61", department: "PM Partners", image: "hp_elitebook_keyboard_reader_wins_pro_bag61.jpg" },
        { name: "samsung galaxy z fold 5 - 7.6 10mp 3x optical zoom telephoto, 50mp wide angle and 12mp ultrawide - 5g - android (12gb ram, 256gb rom) - 4400mah", department: "PM Partners", image: "samsung galaxy z fold 5 - 7.6 10mp 3x optical zoom telephoto, 50mp wide angle and 12mp ultrawide - 5g - android (12gb ram, 256gb rom) - 4400mah.jpg" },
        
        // PI Department Gifts
        { name: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100", department: "PO Partners", image: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100.jpg" },

        // PS Department Gifts
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "CPM Partners", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },

        // PK Department Gifts

        { name: "treadmill 2hp with massager mp3", department: "HSE Partners", image: "treadmill 2hp with massager mp3.jpg" },
        
        // PM Department Gifts

        // PM Department Gifts
        { name: "Hisense 90 Litres Single Door Refrigerator Silver - REF093DR", department: "CSS Partners", image: "Hisense 90 Litres Single Door Refrigerator Silver - REF093DR.jpg" },
        { name: "century digital torch screen dual window air fryer caf-8340-c 10l", department: "CSS Partners", image: "century digital torch screen dual window air fryer caf-8340-c 10l.jpg" },

    // PM Department Gifts
        { name: "Panasonic Heavy-Duty Ice Crusher Commercial Blender 8500wtts", department: "NST Partners", image: "Panasonic Heavy-Duty Ice Crusher Commercial Blender 8500wtts.jpg" },
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "NST Partners", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },

        // PM Department Gifts
        { name: "Hisense 1HP Split Copper Inverter AC", department: "CMO Partners", image: "Hisense 1HP Split Copper Inverter AC.png" },
        { name: "rice", department: "CMO Partners", image: "rice.png" },

        // PM Department Gifts
        { name: "Hisense 1HP Split Copper Inverter AC", department: "PI, IMT, PS & PG Partners", image: "Hisense 1HP Split Copper Inverter AC.jpg" },
        { name: "rice", department: "PI, IMT, PS & PG Partners", image: "rice.jpg" },

        // PM Department Gifts
        { name: "Microwave", department: "HR, RAIS & CLUB Partners", image: "microwave.jpg" },
        { name: "rice", department: "HR, RAIS & CLUB Partners", image: "rice.jpg" },

        // PM Department Gifts
        { name: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100", department: "LSS Partners", image: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100.jpg" },
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "LSS Partners", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },

        // PM Department Gifts
        { name: "One week all expense paid trip to Transcorp Hilton Abuja", department: "ESD & CFS Partners", image: "One week all expense paid trip to Transcorp Hilton Abuja.jpg" },
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "ESD & CFS Partners", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },

        // PM Department Gifts
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "Train 7", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },
        { name: "hisense 20 litres microwave (h20mows14)", department: "Train 7", image: "hisense 20 litres microwave (h20mows14).jpg" },

        // PM Department Gifts
        { name: "kinelco 9pcs aluminium non stick cookware set(4 big pots,1 frying pan)", department: "General Draws", image: "kinelco 9pcs aluminium non stick cookware set(4 big pots,1 frying pan).jpg" },
        { name: "hisense 20 litres microwave (h20mows14)", department: "General Draws", image: "hisense 20 litres microwave (h20mows14).jpg" },

    ];

    // --- End of Hardcoded Gift Data ---

    let participants = [];
    let giftsForDraw = []; // ➡️ Gift list for DRAWING (loaded from localStorage/Admin)
    let results = [];
    let index = 0;
    let isDrawing = false; // NEW: State variable to prevent double clicks
    
    // SLIDER STATE
    let currentGiftIndex = 0;
    let filteredGifts = []; 

    // DOM Elements - Use const for elements that won't be reassigned
    const resultBody = document.querySelector("#resultTable tbody");
    const winnerCard = document.getElementById("winnerCard");
    const winnerNameEl = document.getElementById("winnerName");
    const divisionNameEl = document.getElementById("divisionName");
    const giftNameEl = document.getElementById("giftName");
    const idNumberEl = document.getElementById("idNumber");
    const loader = document.getElementById("loader");
    const giftImageEl = document.getElementById("giftImage");
    const resultTable = document.getElementById("resultTable");
    const departmentSelect = document.getElementById("departmentSelect");
    const maxDrawsInput = document.getElementById("maxDrawsInput");
    const totalGiftsDisplay = document.getElementById("totalGiftsDisplay");
    const startDrawBtn = document.getElementById("startDraw");
    const restartBtn = document.getElementById("restartBtn");
    const homeBtn = document.getElementById("homeBtn");
    const doneMessage = document.getElementById("doneMessage");
    // NEW Slider DOM Elements
    const sliderTrack = document.getElementById("sliderTrack");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const currentDeptDisplay = document.getElementById("currentDeptDisplay");


    // Utility function for robust HTML escaping (prevent XSS in dynamically generated SVG/text)
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    
    // Utility for Async Delay
    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }


    window.addEventListener("DOMContentLoaded", () => {
        const savedParticipants = localStorage.getItem("participantsData");
        const savedGifts = localStorage.getItem("giftsData"); 

        // 1. Load Participants
        if (savedParticipants) {
            try {
                participants = JSON.parse(savedParticipants);
                participants = participants.map((p) => ({
                    name: p.name || p.Name || "Unnamed",
                    division: p.division || p.Division || p.department || p.Department || "—",
                    idCard: p.idCard || p["ID Card Number"] || p["ID"] || "—",
                }));
            } catch(e) {
                console.error("Error parsing participants data:", e);
                alert("⚠️ Error loading participants data. Check console.");
                participants = [];
            }
        } else {
            // alert("⚠️ Participants data not found. Please upload on the admin page first."); // Keep commented for cleaner UX on first load
        }

        // 2. Load Gifts for Draw
        if (savedGifts) {
            try {
                giftsForDraw = JSON.parse(savedGifts);
                // Standardize keys and ensure gift name is always a string
                giftsForDraw = giftsForDraw.map((g) => ({
                    name: String(g.name || g.Gift || g.GiftName || g["Gift Name"] || g.Name || g).trim(),
                    department: g.department || g.Department || g.Division || "General Draws",
                    // Image property here is only for data structure consistency, not used for display image source
                    image: g.image || g.ImageURL || g.Image || g.img || "", 
                }));
            } catch(e) {
                   console.error("Error parsing gifts data:", e);
                alert("⚠️ Error loading gift data. Check console.");
                giftsForDraw = [];
            }
        } else {
            // alert("⚠️ Gift data not found. Please upload the gift list (for drawing) on the admin page first."); // Keep commented for cleaner UX on first load
        }
        
        // 3. Initial UI Update
        const initialGiftCount = giftsForDraw.length;
        totalGiftsDisplay.textContent = initialGiftCount;
        maxDrawsInput.max = initialGiftCount;
        maxDrawsInput.value = Math.min(1, initialGiftCount);
        maxDrawsInput.disabled = initialGiftCount === 0;
        startDrawBtn.disabled = participants.length === 0 || initialGiftCount === 0;

        populateDepartmentSelect();
        updateSliderAndPreview(0); // Initial load of the slider and preview
    });

    function populateDepartmentSelect() {
        // Use giftsDisplayData (hardcoded) to populate selector
        const depts = Array.from(new Set(giftsDisplayData.map(g => (g.department || "General Draws")))).sort();
        departmentSelect.innerHTML = '<option value="">Filter Dept (All)</option>';
        depts.forEach(d => {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            departmentSelect.appendChild(opt);
        });

        // Event listener is now updated to call the new slider logic
        departmentSelect.addEventListener("change", () => updateSliderAndPreview(0));
    }
    
    // NEW: Function to manage slider state and UI
    function updateSliderAndPreview(newIndex) {
        const selected = departmentSelect.value;
        currentDeptDisplay.textContent = selected || "All";
        filteredGifts = selected 
            ? giftsDisplayData.filter(g => (g.department || "General Draws") === selected) 
            : giftsDisplayData;

        // Reset index if out of bounds
        currentGiftIndex = Math.max(0, Math.min(newIndex, filteredGifts.length - 1));

        sliderTrack.innerHTML = "";
        if (!filteredGifts.length) {
            sliderTrack.style.transform = `translateX(0)`;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            previewGift({ name: "No Gifts Available", department: "N/A" });
            return;
        }

        filteredGifts.forEach((g, i) => {
            const item = document.createElement("div");
            item.className = "slider-item";
            if (i === currentGiftIndex) {
                item.classList.add("active");
            }
            item.setAttribute('data-index', i);
            item.setAttribute('role', 'button'); 

            const imageSrc = (g.image && g.image.trim()) 
                ? g.image
                : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="100"><rect width="100%" height="100%" fill="#203040"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Poppins" font-size="14" fill="#00c6ff">${escapeHtml(g.name.substring(0, 20) || 'Gift')}</text></svg>`)}`;

            item.innerHTML = `
                <img src="${imageSrc}" alt="Preview of ${g.name}" title="${g.name}">
                <span class="gallery-label">${g.name}</span>
            `;

            item.addEventListener('click', () => {
                updateSliderAndPreview(i);
            });

            sliderTrack.appendChild(item);
        });
        
        // Calculate the translation to center the active item (showing 3 items, so center is index 1)
        let centerOffset = 0;
        if (filteredGifts.length > 0) {
             // For 3 visible items (33.333% each), the middle is at 1/3, but we want the currently active item to be visually near the center.
             // We shift by 33.333% for the active item, then adjust for the position of the active item.
             // If active is index 0, shift 0%.
             // If active is index 1, shift -33.333%.
             // If active is index 2, shift -66.666%.
             // General formula: - (active index - 1) * 33.333%
            centerOffset = (currentGiftIndex * 33.333) - 33.333; // Shift to make index 1 centered
            centerOffset = Math.min(0, Math.max(-(filteredGifts.length - 3) * 33.333, -centerOffset));
            
             // Force active item to be visible if less than 3 items
             if (filteredGifts.length <= 3) {
                centerOffset = 0;
             }
        }
        
        // Clamp the offset to prevent excessive scrolling past the ends
        sliderTrack.style.transform = `translateX(${-centerOffset}%)`;

        // Update button states
        prevBtn.disabled = currentGiftIndex === 0;
        nextBtn.disabled = currentGiftIndex >= filteredGifts.length - 1;
        
        // Now call previewGift for the newly active item
        previewGift(filteredGifts[currentGiftIndex]);
    }
    
    // NEW: Slider Control Handlers
    prevBtn.addEventListener('click', () => {
        if (currentGiftIndex > 0) {
            updateSliderAndPreview(currentGiftIndex - 1);
        }
    });

    nextBtn.addEventListener('click', () => {
        if (currentGiftIndex < filteredGifts.length - 1) {
            updateSliderAndPreview(currentGiftIndex + 1);
        }
    });


    // Function to Preview a Gift - SLIGHTLY MODIFIED TO USE filteredGifts
    async function previewGift(giftObj) {
        winnerCard.classList.remove("is-active"); // Remove active state on preview
        winnerCard.style.display = "block";
        
        winnerNameEl.textContent = "🎁 Gift Preview";
        idNumberEl.textContent = `Department: ${giftObj.department || "General Draws"}`;
        divisionNameEl.textContent = "Click 'Start Draw' to begin!";
        giftNameEl.textContent = `Featured Gift: ${giftObj.name}`;

        // Find the image source from the hardcoded display data
        const displayGift = giftsDisplayData.find(g => 
            g.name === giftObj.name && g.department === giftObj.department
        ) || giftObj; // Fallback to the object itself if not found in display list

        // Fallback SVG for the large card
        const giftImageSrc = (displayGift.image && displayGift.image.trim()) 
            ? displayGift.image 
            : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Poppins" font-size="28" fill="#004aad">${escapeHtml(displayGift.name || 'Gift Preview')}</text></svg>`)}`;
        
        // Image transition logic
        if (giftImageEl.classList.contains("entering") || giftImageEl.classList.contains("floating") || giftImageEl.src) {
            giftImageEl.classList.remove("entering", "floating");
            giftImageEl.classList.add("leaving");
            await sleep(500); 
        }

        giftImageEl.src = giftImageSrc;
        giftImageEl.classList.remove("leaving"); 
        void giftImageEl.offsetWidth; 
        giftImageEl.classList.add("entering");

        // After the entering animation, start the continuous floating
        setTimeout(() => {
            giftImageEl.classList.remove("entering");
            giftImageEl.classList.add("floating");
        }, 700); 
    }


    document.getElementById("startDraw").addEventListener("click", async () => {
        if (isDrawing) return; // Prevent multiple draws
        isDrawing = true;
        startDrawBtn.disabled = true;
        maxDrawsInput.disabled = true;
        departmentSelect.disabled = true;
        restartBtn.disabled = true;
        
        // Disable slider controls during draw
        prevBtn.disabled = true;
        nextBtn.disabled = true;

        if (!participants.length) {
            alert("Participant data is not loaded.");
            isDrawing = false;
            startDrawBtn.disabled = false;
            return;
        }

        const usableGifts = giftsForDraw.slice();
        if (!usableGifts.length) {
            alert("Gift data for drawing is empty. Please upload the gift list first.");
            isDrawing = false;
            startDrawBtn.disabled = false;
            return;
        }

        const desiredDraws = parseInt(maxDrawsInput.value, 10);
        const numDraws = Math.min(participants.length, usableGifts.length, desiredDraws);

        if (numDraws === 0) {
            alert("Cannot run draw. Check participant count, gift count, and desired draws input.");
            isDrawing = false;
            startDrawBtn.disabled = false;
            maxDrawsInput.disabled = false;
            departmentSelect.disabled = false;
            restartBtn.disabled = false;
            
            // Re-enable slider controls
            prevBtn.disabled = currentGiftIndex === 0;
            nextBtn.disabled = currentGiftIndex >= filteredGifts.length - 1;
            return;
        }

        // Shuffle participants and gifts *once* before the draw sequence starts
        const shuffledParticipants = [...participants].sort(() => 0.5 - Math.random());
        const shuffledGifts = [...usableGifts].sort(() => 0.5 - Math.random());

        // Perform the selection logic upfront
        results = [];
        for (let i = 0; i < numDraws; i++) {
            results.push({
                name: shuffledParticipants[i].name,
                division: shuffledParticipants[i].division,
                idCard: shuffledParticipants[i].idCard,
                gift: shuffledGifts[i], // The gift object from the UPLOADED file
            });
            // CRITICAL: Remove drawn participant and gift from the main lists (simulation)
            // NOTE: For a persistent draw, you'd also save the updated participant/gift lists back to localStorage.
            participants.splice(participants.findIndex(p => p.name === shuffledParticipants[i].name && p.idCard === shuffledParticipants[i].idCard), 1);
            giftsForDraw.splice(giftsForDraw.findIndex(g => g.name === shuffledGifts[i].name), 1);
        }

        resultBody.innerHTML = "";
        index = 0;

        // Start the visual sequence
        giftImageEl.classList.remove("floating");
        await runDrawSequence();

        // Update the UI state after the draw
        totalGiftsDisplay.textContent = giftsForDraw.length;
        maxDrawsInput.max = giftsForDraw.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length);
        maxDrawsInput.disabled = giftsForDraw.length === 0;
        startDrawBtn.disabled = giftsForDraw.length === 0 || participants.length === 0;
        departmentSelect.disabled = false;
        restartBtn.disabled = false;
        isDrawing = false;
        
        // Re-enable slider controls
        prevBtn.disabled = currentGiftIndex === 0;
        nextBtn.disabled = currentGiftIndex >= filteredGifts.length - 1;
    });

    // Event listeners
    homeBtn.addEventListener("click", () => {
        // IMPORTANT: Ensure correct path
        window.location.href = "/index.html"; 
    });

    restartBtn.addEventListener("click", () => {
        window.location.reload(); // Simplest way to fully reset state
    });

    async function runDrawSequence() {
        for (let i = 0; i < results.length; i++) {
            if (i === 0) {
                // Ensure winner card is shown before countdown starts
                winnerCard.style.display = "block";
                await startCountdown(10);
            } else {
                // Clear the current winner card content and animate out the image
                winnerCard.classList.remove("is-active");
                giftImageEl.classList.remove("entering", "floating");
                giftImageEl.classList.add("leaving");
                await sleep(500); 
                // Delay before announcing the next winner
                await startCountdown(3); 
            }
            await announceWinnerSequence(results[i]);
        }

        doneMessage.style.display = "block";
        if (typeof confetti === "function") {
            confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
        }
    }

    async function announceWinnerSequence(winnerData) {
        
        // 1. Get the corresponding display gift object for the image
        const displayGift = giftsDisplayData.find(g => 
            g.name === winnerData.gift.name && g.department === winnerData.gift.department
        ) || winnerData.gift; // Fallback

        // 2. Animate out old image
        giftImageEl.classList.remove("entering", "floating");
        giftImageEl.classList.add("leaving");
        await sleep(500); 

        // 3. Update main card content
        winnerNameEl.textContent = `🏆 Winner: ${winnerData.name}`;
        idNumberEl.textContent = `🪪 ID: ${winnerData.idCard}`;
        divisionNameEl.textContent = `🏢 Division: ${winnerData.division}`;
        giftNameEl.textContent = `🎁 Prize: ${winnerData.gift.name}`;

        // 4. Update the table
        const newRow = resultBody.insertRow();
        newRow.innerHTML = `
            <td>${resultBody.rows.length}</td>
            <td>${escapeHtml(winnerData.name)}</td>
            <td>${escapeHtml(winnerData.idCard)}</td>
            <td>${escapeHtml(winnerData.division)}</td>
            <td>${escapeHtml(winnerData.gift.name)}</td>
        `;
        resultTable.style.display = "table"; // Ensure table is visible
        resultTable.scrollIntoView({ behavior: 'smooth', block: 'end' });
        
        // 5. Animate in new image
        const giftImageSrc = (displayGift.image && displayGift.image.trim()) 
            ? displayGift.image 
            : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#ffedcc"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Poppins" font-size="28" fill="#e63946">WINNER: ${escapeHtml(winnerData.gift.name || 'Prize')}</text></svg>`)}`;

        giftImageEl.src = giftImageSrc;
        giftImageEl.classList.remove("leaving"); 
        void giftImageEl.offsetWidth; 
        giftImageEl.classList.add("entering");

        // 6. After the entering animation, start the continuous floating
        setTimeout(() => {
            giftImageEl.classList.remove("entering");
            giftImageEl.classList.add("floating");
        }, 700); 

        winnerCard.classList.add("is-active");
        if (typeof confetti === "function") {
            // Explode confetti around the winner card
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { x: 0.5, y: 0.8 },
                zIndex: 100
            });
        }
        await sleep(4000); // Display time for the winner
    }

    function startCountdown(seconds) {
        return new Promise((resolve) => {
            let count = seconds;
            loader.textContent = count;
            loader.style.display = "flex";

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    loader.textContent = count;
                    loader.style.fontSize = `${10 - (10 - count)/2}rem`; // Add subtle size animation
                } else {
                    clearInterval(timer);
                    loader.style.display = "none";
                    resolve();
                }
            }, 1000);
        })
    }
</script>
