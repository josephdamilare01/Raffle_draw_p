<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎁 NLNG End of Year Raffle Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<style>
:root {
  --accent1: #00c6ff;
  --accent2: #0072ff;
  --accent3: #00ff80;
  --dark: #0a0f1c;
  --glass: rgba(255,255,255,0.15);
}
html, body {
  height: 100%;
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
  color: white;
  text-align: center;
  overflow-x: hidden;
}
h1 {
  margin: 20px 0 25px;
  font-size: 3rem;
  background: linear-gradient(90deg, var(--accent1), var(--accent3), #ffd166);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% 100%;
  animation: gradientMove 6s linear infinite;
}
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin-bottom: 25px;
}
.controls select, .controls input {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-size: 1rem;
  font-weight: 500;
  outline: none;
  background: var(--glass);
  color: white;
  backdrop-filter: blur(10px);
}
.controls select option { color: #000; }
.btn {
  background: linear-gradient(90deg, var(--accent2), var(--accent1));
  border: none;
  color: #fff;
  padding: 12px 25px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all .3s ease;
}
.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Gift motion display */
#deptGifts {
  display: none;
  margin: 25px auto;
  max-width: 900px;
  text-align: center;
}
#deptGifts h3 {
  font-size: 1.6rem;
  margin-bottom: 10px;
  color: var(--accent3);
}
.gift-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}
.gift-item {
  background: rgba(255,255,255,0.1);
  border-radius: 15px;
  padding: 10px;
  width: 150px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
  opacity: 0;
  transform: translateY(30px);
  animation: giftIn 0.8s forwards;
}
.gift-item.exit {
  animation: giftOut 0.6s forwards;
}
@keyframes giftIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes giftOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-30px); }
}
.gift-item img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  border-radius: 10px;
  margin-bottom: 8px;
}
.gift-item span {
  font-weight: 600;
  color: #fff;
}

/* Rolling & Winner */
#rollingBox {
  display: none;
  font-size: 2.5rem;
  margin: 25px auto;
  font-weight: 700;
  color: var(--accent3);
  text-shadow: 0 0 10px var(--accent3);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.05); }
}
.winner-card {
  display: none;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  max-width: 700px;
  margin: 0 auto 30px;
  animation: popIn 0.7s ease;
}
@keyframes popIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.winner-card img {
  width: 350px;
  height: 350px;
  object-fit: contain;
  margin: 20px auto;
  display: block;
  border-radius: 18px;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 25px rgba(255,255,255,0.3);
}
.winner-name {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 5px;
  background: linear-gradient(90deg,var(--accent2), var(--accent3));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.winner-dept, .winner-id, .winner-gift {
  font-size: 1.3rem;
  margin: 6px 0;
}

/* Table */
.table-container {
  width: 90%;
  margin: 0 auto;
  overflow-x: auto;
  display: none; /* initially hidden */
}
table {
  width: 100%;
  border-collapse: collapse;
  color: #fff;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}
th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
thead th {
  background: linear-gradient(90deg, var(--accent2), var(--accent1));
  color: white;
}
tr:hover td {
  background: rgba(255,255,255,0.1);
}
</style>
</head>

<body>
  <h1>🎊 NLNG End of Year Raffle Draw</h1>

  <div class="controls">
    <select id="departmentFilter">
      <option value="">Select Department</option>
      <option value="Department A">Department A</option>
      <option value="Department B">Department B</option>
      <option value="Department C">Department C</option>
    </select>
    <input type="number" id="numDraws" placeholder="Number of Winners" min="1" />
    <button class="btn" id="startDraw">Start Draw</button>
  </div>

  <div id="deptGifts">
    <h3>🎁 Gifts for Selected Department</h3>
    <div class="gift-list" id="giftList"></div>
  </div>

  <div id="rollingBox">🎡 Rolling...</div>

  <div class="winner-card" id="winnerCard">
    <h2 class="winner-name" id="winnerName">🏆 Winner</h2>
    <div class="winner-dept" id="winnerDept"></div>
    <div class="winner-id" id="winnerId"></div>
    <img id="giftImage" src="" alt="Gift Image" />
    <div class="winner-gift" id="giftName">🎁 Gift</div>
  </div>

  <div class="table-container" id="tableContainer">
    <table id="resultTable">
      <thead><tr><th>#</th><th>Name</th><th>Department</th><th>ID</th><th>Gift</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
let participants = [];
let gifts = [];
let resultList = [];

let departmentGiftMap = {
  "Department A": ["Smartphone", "Laptop", "Bluetooth Speaker"],
  "Department B": ["Smart Watch", "Tablet", "Power Bank"],
  "Department C": ["Television", "Microwave", "Air Fryer"]
};

const giftImageMap = {
  "smartphone": "images/Smartphone.jpg",
  "laptop": "images/Laptop.jpg",
  "bluetooth speaker": "images/Bluetooth Speaker.jpg",
  "smart watch": "images/Smart Watch.jpg",
  "tablet": "images/Tablet.jpg",
  "power bank": "images/Power Bank.jpg",
  "television": "images/Television.jpg",
  "microwave": "images/Microwave.jpg",
  "air fryer": "images/Air Fryer.jpg"
};

// Load Excel data if saved
window.addEventListener("DOMContentLoaded", () => {
  const savedParticipants = localStorage.getItem("participantsData");
  const savedGifts = localStorage.getItem("giftsData");
  if (savedParticipants) participants = JSON.parse(savedParticipants);
  if (savedGifts) gifts = JSON.parse(savedGifts);
});

// Animate department gifts
document.getElementById("departmentFilter").addEventListener("change", () => {
  const dept = document.getElementById("departmentFilter").value;
  const list = document.getElementById("giftList");
  const container = document.getElementById("deptGifts");

  // exit animation
  [...list.children].forEach(item => item.classList.add("exit"));
  setTimeout(() => {
    list.innerHTML = "";
    if (dept && departmentGiftMap[dept]) {
      container.style.display = "block";
      departmentGiftMap[dept].forEach((g, i) => {
        const giftImg = giftImageMap[g.toLowerCase()] || "images/default.png";
        const div = document.createElement("div");
        div.className = "gift-item";
        div.style.animationDelay = `${i * 0.1}s`;
        div.innerHTML = `<img src="${giftImg}" alt="${g}"><span>${g}</span>`;
        list.appendChild(div);
      });
    } else container.style.display = "none";
  }, 500);
});

document.getElementById("startDraw").addEventListener("click", startDraw);

function startDraw() {
  const dept = document.getElementById("departmentFilter").value;
  const num = parseInt(document.getElementById("numDraws").value) || 1;
  let availableNames = dept ? participants.filter(p => (p.Department || p.Division) === dept) : [...participants];
  let availableGifts = [...gifts];

  if (!availableNames.length || !availableGifts.length) {
    alert("⚠️ Please select a department and ensure participants & gifts are uploaded.");
    return;
  }

  const winnersCount = Math.min(num, availableNames.length, availableGifts.length);
  resultList = [];

  for (let i = 0; i < winnersCount; i++) {
    const pIndex = Math.floor(Math.random() * availableNames.length);
    const gIndex = Math.floor(Math.random() * availableGifts.length);
    const person = availableNames.splice(pIndex, 1)[0];
    const gift = availableGifts.splice(gIndex, 1)[0];
    resultList.push({...person, gift});
  }

  runAnimatedDraw();
}

async function runAnimatedDraw() {
  for (let winner of resultList) {
    await animateDraw(winner);
    await sleep(2000);
  }
  confetti({ particleCount: 300, spread: 100, origin:{y:0.6}});
}

async function animateDraw(winner) {
  const rollBox = document.getElementById("rollingBox");
  const card = document.getElementById("winnerCard");
  const img = document.getElementById("giftImage");
  rollBox.style.display = "block";
  card.style.display = "none";

  for (let speed = 100; speed >= 25; speed -= 10) {
    const rand = participants[Math.floor(Math.random() * participants.length)];
    rollBox.textContent = `🎡 ${rand?.Name || "Rolling..."}`;
    await sleep(speed);
  }

  rollBox.style.display = "none";
  document.getElementById("winnerName").textContent = `🏆 ${winner.Name}`;
  document.getElementById("winnerDept").textContent = `🏢 ${winner.Department}`;
  document.getElementById("winnerId").textContent = `🪪 ${winner.ID}`;
  document.getElementById("giftName").textContent = `🎁 ${winner.gift}`;

  const giftImg = giftImageMap[winner.gift?.toLowerCase()] || "images/default.png";
  img.src = giftImg;

  card.style.display = "block";
  appendToTable(winner);
  confetti({ particleCount: 180, spread: 90, origin:{y:0.6}});
}

function appendToTable(winner) {
  const tableContainer = document.getElementById("tableContainer");
  tableContainer.style.display = "block"; // show table only after first draw
  const tbody = document.querySelector("#resultTable tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${tbody.children.length+1}</td>
                  <td>${winner.Name}</td>
                  <td>${winner.Department}</td>
                  <td>${winner.ID}</td>
                  <td>${winner.gift}</td>`;
  tbody.appendChild(tr);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
