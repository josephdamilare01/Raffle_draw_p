<html lang="en">
<head>

    <style>
        :root {
            --accent1: #00c6ff;
            --accent2: #0072ff;
            --accent3: #00ff80;
            --dark: #071428;
            /* New Accent Color from Carousel Design */
            --carousel-accent: #14ff72cb; 
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* --- Custom Fonts (Added from Carousel CSS) --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        /* Header section styles (Retained from original code, but modified to cooperate with fixed carousel) */
        header {
            width: 100%;
            max-width: 100%;
            padding-left: 100px;
            height: 50px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1000;
        }
        
        /* Your original styles */
        h1 {
            margin: 10px 0 16px;
            font-size: 5rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent1), var(--accent3), #ffd166);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 100%;
            animation: gradientMove 6s linear infinite;
            position: relative; /* Ensure H1 is above carousel if not using a header element */
            z-index: 500;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px 0 60px;
            align-items: stretch;
            position: relative;
            z-index: 10; /* Ensure content is above the carousel background */
        }

        .top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-direction: column;
        }

        /* Table container (kept for structure, but table itself is hidden) */
        .left {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
        }

        /* ... (rest of your raffle page CSS remains the same) ... */
        
        /* ➡️ IMPORTANT: Winner Card is now transparent to show the background carousel */
        .winner-card {
            width: 100%;
            max-width: 800px;
            /* Make background transparent */
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent dark overlay */
            color: #fff; /* White text for contrast */
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            position: relative;
            overflow: visible;
            display: none;
            animation: popIn 700ms ease;
            margin: 0 auto;
            backdrop-filter: blur(5px); /* Add blur for visibility over the moving background */
        }
        
        .winner-name {
            font-size: 1.9rem;
            font-weight: 700;
            /* Change gradient for better visibility */
            background: linear-gradient(90deg, #ffd166, #fff); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        
        .division-name, .id-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e6e6e6; /* Lighter color for visibility */
            margin-bottom: 8px;
        }

        /* ... (The rest of your existing raffle CSS) ... */


        /* ========================================================== */
        /* --- CAROUSEL CSS INTEGRATION (From previous step) --- */
        /* ========================================================== */

        .carousel {
            width: 100vw;
            height: 100vh;
            margin-top: -50px; 
            overflow: hidden;
            position: fixed; /* Changed to fixed to act as a background */
            top: 0;
            left: 0;
            z-index: 1; /* Low z-index to sit behind the raffle content */
        }

        .carousel .list {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .carousel .list .item {
            width: 180px;
            height: 250px;
            position: absolute;
            top: 80%;
            transform: translateY(-70%);
            left: 70%;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            background-position: 50% 50%;
            background-size: cover;
            z-index: 100;
            transition: 1s;
            opacity: 0; 
            pointer-events: none;
            display: block;
            background-repeat: no-repeat;
        }

        .carousel .list .item.active {
            top: 0;
            left: 0;
            transform: translate(0, 0);
            border-radius: 0;
            width: 100%;
            height: 100%;
            z-index: 99; 
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Fallback/Initial state for the first two items */
        .carousel .list .item:nth-child(1),
        .carousel .list .item:nth-child(2){
            top: 0;
            left: 0;
            transform: translate(0, 0);
            border-radius: 0;
            width: 100%;
            height: 100%;
            z-index: 99; 
        }

        /* Next items */
        .carousel .list .item:nth-child(3){ left: 67%; opacity: 1; }
        .carousel .list .item:nth-child(4){ left: calc(67% + 200px); opacity: 1; }
        .carousel .list .item:nth-child(5){ left: calc(67% + 400px); opacity: 1; }
        .carousel .list .item:nth-child(6){ left: calc(67% + 600px); opacity: 1; }

        /* Hidden items */
        .carousel .list .item:nth-child(n+7){
            left: calc(67% + 800px);
            opacity: 0;
        }

        /* Dark overlay for better text readability on the active item only */
        .carousel .list .item::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7); 
            display: none; 
        }
        .carousel .list .item.active::before,
        .carousel .list .item:nth-child(2)::before { 
            display: block;
        }

        /* Content (Hidden, as the main page content is used instead) */
        .carousel .list .item .content { display: none; }


        /* Arrows */
        .arrows {
            position: absolute;
            bottom: 50%;
            right: 20px; /* Moved slightly to the right to be visible */
            transform: translateY(50%);
            z-index: 500; /* High z-index */
            width: 100px; /* Smaller width for two buttons */
            display: flex;
            justify-content: flex-end; /* Align right */
            gap: 10px;
            padding: 0 20px;
        }
        .arrows button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--carousel-accent);
            border: none;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s;
            font-family: monospace;
        }
        .arrows button:hover {
            background-color: #fff;
            color: #000;
        }

        /* Time Running */
        .carousel .timeRunning {
            position: absolute;
            z-index: 1000;
            width: 0%;
            height: 4px;
            background-color: var(--carousel-accent);
            left: 0;
            top: 0;
            animation: runningTime 7s linear 1 forwards;
            transition: none;
        }

        @keyframes runningTime {
            from{width: 0%;}
            to{width: 100%;}
        }

        /* Animation for content (Used by JS to hide/show elements) */
        @keyframes animate {
            from{
                opacity: 0;
                transform: translate(0, 100px);
                filter: blur(33px);
            }
            to{
                opacity: 1;
                transform: translate(0);
                filter: blur(0);
            }
        }
        
        /* Responsive adjustments for carousel */
        @media screen and (max-width: 999px){
            .carousel .list .item .content{ left: 50px; }
            .arrows { right: 0; }
        }
        @media screen and (max-width: 690px){
            .carousel .list .item:nth-child(3){ left: 55%; }
            .carousel .list .item:nth-child(4){ left: calc(55% + 150px); }
            .carousel .list .item:nth-child(5){ left: calc(55% + 300px); }
            .carousel .list .item:nth-child(6){ left: calc(55% + 450px); }
        }


    </style>
</head>

<body>

<script>
    // --- Start of Hardcoded Gift Data ---
    const giftsHardcoded = [

        { name: "rice", department: "PI, IMT, PS & PG Partners", image: "rice.jpg" },

        // PM Department Gifts
        { name: "Microwave", department: "HR, RAIS & CLUB Partners", image: "microwave.jpg" },
        { name: "rice", department: "HR, RAIS & CLUB Partners", image: "rice.jpg" },

        // PM Department Gifts
        { name: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100", department: "LSS Partners", image: "hisense 240w 2.1ch bluetooth audio sound bar, - hs 2100.jpg" },
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "LSS Partners", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },

        // PM Department Gifts
        { name: "One week all expense paid trip to Transcorp Hilton Abuja", department: "ESD & CFS Partners", image: "One week all expense paid trip to Transcorp Hilton Abuja.jpg" },
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "ESD & CFS Partners", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },

        // PM Department Gifts
        { name: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87", department: "Train 7", image: "SAMSUNG GALAXY TAB A9 8128 WI-FI 87.jpg" },
        { name: "hisense 20 litres microwave (h20mows14)", department: "Train 7", image: "hisense 20 litres microwave (h20mows14).jpg" },

        // PM Department Gifts
        { name: "kinelco 9pcs aluminium non stick cookware set(4 big pots,1 frying pan)", department: "General Draws", image: "kinelco 9pcs aluminium non stick cookware set(4 big pots,1 frying pan).jpg" },
        { name: "hisense 20 litres microwave (h20mows14)", department: "General Draws", image: "hisense 20 litres microwave (h20mows14).jpg" },
    ];
    // --- End of Hardcoded Gift Data ---

    let participants = [];
    let gifts = giftsHardcoded; 
    let giftsForDraw = [];       
    let results = [];
    let index = 0;
    const resultBody = document.querySelector("#resultTable tbody");
    const winnerCard = document.getElementById("winnerCard");
    const winnerNameEl = document.getElementById("winnerName");
    const divisionNameEl = document.getElementById("divisionName");
    const giftNameEl = document.getElementById("giftName");
    const idNumberEl = document.getElementById("idNumber");
    const loader = document.getElementById("loader");
    const giftImageEl = document.getElementById("giftImage");
    const resultTable = document.getElementById("resultTable");
    const gallery = document.getElementById("gallery");
    const departmentSelect = document.getElementById("departmentSelect");
    const maxDrawsInput = document.getElementById("maxDrawsInput"); 
    const totalGiftsDisplay = document.getElementById("totalGiftsDisplay"); 

    // -------------------------------------------------------------
    // --- CAROUSEL JS INTEGRATION (From previous step) ---
    // -------------------------------------------------------------

    // --- Element Selection (Carousel specific) ---
    const carousel = document.getElementById('giftCarousel');
    const list = carousel ? carousel.querySelector('.list') : null;
    const nextButton = carousel ? carousel.querySelector('.next') : null;
    const prevButton = carousel ? carousel.querySelector('.prev') : null;
    const timeRunning = carousel ? carousel.querySelector('.timeRunning') : null;

    // --- Configuration (Carousel specific) ---
    const transitionDuration = 1000; 
    const autoPlayTime = 7000; 

    // --- Timer Variables (Carousel specific) ---
    let runTimeOut; 
    let runNextAuto; 

    /**
     * Dynamically generates the carousel items from the hardcoded gift list.
     */
    function generateCarouselItems() {
        if (!list || !giftsHardcoded.length) return;

        giftsHardcoded.forEach((gift, index) => {
            const item = document.createElement('div');
            item.classList.add('item');
            
            // Set the background image
            item.style.backgroundImage = `url(${gift.image})`;

            // The second item is the initial active one in this design
            if (index === 1) {
                item.classList.add('active'); 
            }

            // Inject minimal content wrapper, though it's hidden by CSS
            item.innerHTML = `
                <div class="content">
                    <div class="title">Gift Preview</div>
                    <div class="name">${gift.name}</div>
                </div>
            `;
            list.appendChild(item);
        });
    }

    /**
     * Resets and restarts the CSS animation for the progress bar.
     */
    function resetTimeAnimation() {
        if (!timeRunning) return;
        timeRunning.style.animation = 'none';
        timeRunning.offsetHeight; /* trigger reflow */
        timeRunning.style.animation = null; 
        timeRunning.style.animation = `runningTime ${autoPlayTime / 1000}s linear 1 forwards`;
    }

    /**
     * Main function to move the slider by reordering DOM elements.
     * @param {string} type - 'next' or 'prev'.
     */
    function showSlider(type) {
        if (!list) return;
        const sliderItemsDom = list.querySelectorAll('.carousel .list .item');
        if (sliderItemsDom.length < 2) return;

        // 1. Reorder the DOM elements
        if (type === 'next') {
            list.appendChild(sliderItemsDom[0]);
            carousel.classList.add('next');
        } else {
            list.prepend(sliderItemsDom[sliderItemsDom.length - 1]);
            carousel.classList.add('prev');
        }
        
        // 2. Manage the 'active' class for content/overlay visibility
        // Remove the 'active' class from ALL items
        sliderItemsDom.forEach(item => item.classList.remove('active'));

        // Apply 'active' to the item at index 1 (the full-screen, visible item)
        const newList = list.querySelectorAll('.carousel .list .item');
        if (newList.length >= 2) {
            newList[1].classList.add('active'); 
        }

        // 3. Manage the transition classes
        clearTimeout(runTimeOut);
        runTimeOut = setTimeout( () => {
            carousel.classList.remove('next');
            carousel.classList.remove('prev');
        }, transitionDuration); 

        // 4. Reset Auto-Play Timer and Progress Bar
        clearTimeout(runNextAuto);
        runNextAuto = setTimeout(() => {
            nextButton.click(); 
        }, autoPlayTime);

        resetTimeAnimation();
    }
    
    // --- Event Listeners for Buttons (Carousel specific) ---
    if (nextButton && prevButton) {
        nextButton.addEventListener('click', () => { showSlider('next'); });
        prevButton.addEventListener('click', () => { showSlider('prev'); });
    }

    // -------------------------------------------------------------
    // --- END CAROUSEL JS INTEGRATION ---
    // -------------------------------------------------------------


    window.addEventListener("DOMContentLoaded", () => {
        // --- Raffle Logic Setup ---
        const savedParticipants = localStorage.getItem("participantsData");
        const savedGifts = localStorage.getItem("giftsData"); 

        if (savedParticipants) {
            participants = JSON.parse(savedParticipants).map((p) => ({
                name: p.name || p.Name || "Unnamed",
                division: p.division || p.Division || p.department || p.Department || "—",
                idCard: p.idCard || p["ID Card Number"] || p["ID"] || "—",

            alert("⚠️ Please upload participants on the admin page first.");
        }

        if (savedGifts) {
            giftsForDraw = JSON.parse(savedGifts).map((g) => ({

                image: g.image || g.ImageURL || g.Image || g.img || "", 
            }));
        } else {
            alert("⚠️ Please upload the gift list (for drawing) on the admin page first.");
        }
        
        if (gifts.length === 0) {
            alert("⚠️ Error: Hardcoded gift data (for display) is empty. Cannot show carousel.");
            return;
        }

        // NEW: Update total gifts display and max draws input
        totalGiftsDisplay.textContent = giftsForDraw.length;
        maxDrawsInput.max = giftsForDraw.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length);

        // --- Carousel Initialization ---
        generateCarouselItems(); 
        resetTimeAnimation(); // Start the initial progress bar animation
        runNextAuto = setTimeout(() => {
            if(nextButton) nextButton.click();
        }, autoPlayTime);

        // --- Raffle UI Initialization ---
        populateDepartmentSelect();
        // updateGallery is no longer needed since the gallery is hidden
    });

    // ... (Your other helper functions: populateDepartmentSelect, updateGallery, escapeHtml, sleep) ...

    function populateDepartmentSelect() {
        // Uses hardcoded gifts (gifts) to populate selector
        const depts = Array.from(new Set(gifts.map(g => (g.department || "General")))).sort();
        departmentSelect.innerHTML = '<option value="">Select Department (All)</option>';
        depts.forEach(d => {
            const opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            departmentSelect.appendChild(opt);
        });

        // The gallery update event listener is irrelevant now, but kept in case you want filtering later
        departmentSelect.addEventListener("change", () => {
            // Note: The carousel does NOT filter automatically. Filtering must be done manually if needed.
        });
    }
    
    // Function to Preview a Gift (kept the same, but no longer triggered by gallery)
    async function previewGift(giftObj) {
        winnerCard.style.display = "block";
        winnerNameEl.textContent = "🎁 Gift Preview";
        idNumberEl.textContent = `Department: ${giftObj.department || "General"}`;
        divisionNameEl.textContent = "Click 'Start Draw' to begin!";
        giftNameEl.textContent = `Featured Gift: ${giftObj.name}`;

        const giftImageSrc = (giftObj.image && giftObj.image.trim()) 
            ? giftObj.image 
            : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">${escapeHtml(giftObj.name || 'Gift')}</text></svg>`)}`;
        
        // Ensure the old image animates out before the new one animates in
        if (giftImageEl.classList.contains("entering") || giftImageEl.classList.contains("floating")) {
            giftImageEl.classList.remove("entering", "floating");
            giftImageEl.classList.add("leaving");
            await sleep(500); // Wait for leaving animation to complete
        } else if (giftImageEl.classList.contains("leaving")) {
                // If already leaving, just wait
             await sleep(500);
        }

        giftImageEl.src = giftImageSrc;
        giftImageEl.classList.remove("leaving"); // Remove leaving if it was there
        void giftImageEl.offsetWidth; // Trigger reflow to restart animation
        giftImageEl.classList.add("entering");

        // After the entering animation, start the continuous floating
        setTimeout(() => {
            giftImageEl.classList.remove("entering");
            giftImageEl.classList.add("floating"); // Add the new floating animation
        }, 700); // Duration of the 'entering' animation
    }

    // ... (The rest of your raffle logic) ...
    
    document.getElementById("startDraw").addEventListener("click", async () => {
        // ... (existing draw setup logic) ...
        if (!participants.length) {
            alert("Participant data is not loaded. Please upload participants first.");
            return;
        }
        if (!giftsForDraw.length) {
            alert("Gift data for drawing is empty. Please upload the gift list first.");
            return;
        }

        const desiredDraws = parseInt(maxDrawsInput.value, 10);
        if (isNaN(desiredDraws) || desiredDraws < 1) {
            alert("Please enter a valid number of draws (1 or more).");
            return;
        }

        const usableGifts = giftsForDraw.slice();
        const numDraws = Math.min(participants.length, usableGifts.length, desiredDraws);

        if (numDraws === 0) {
              alert("Cannot run draw. Check participant count, gift count, and desired draws input.");
              return;
        }

        const shuffledParticipants = [...participants].sort(() => 0.5 - Math.random());
        const shuffledGifts = [...usableGifts].sort(() => 0.5 - Math.random());

        results = [];
        for (let i = 0; i < numDraws; i++) {
            results.push({
                name: shuffledParticipants[i].name,
                division: shuffledParticipants[i].division,
                idCard: shuffledParticipants[i].idCard,
                gift: shuffledGifts[i], 
            });
        }

        resultBody.innerHTML = "";
        index = 0;

        // Stop carousel auto-play and reset
        clearTimeout(runNextAuto); 
        if (timeRunning) timeRunning.style.animation = 'none';

        // Remove floating animation when draw starts
        giftImageEl.classList.remove("floating"); 
        runDrawSequence();

        // NEW: Update the total gifts available to reflect the draw (simulated replacement)
        totalGiftsDisplay.textContent = giftsForDraw.length - results.length;
        maxDrawsInput.max = giftsForDraw.length - results.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length - results.length);
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
        // ... (existing restart logic) ...
        results = [];
        index = 0;
        resultBody.innerHTML = "";
        resultTable.style.display = "none";
        winnerCard.style.display = "none";
        
        giftImageEl.src = "";
        giftImageEl.classList.remove("entering", "leaving", "floating");

        winnerNameEl.textContent = "🎁 Gift Preview / 🏆 Winner Name";
        idNumberEl.textContent = "🪪 ID Card Number";
        divisionNameEl.textContent = "🏢 Division";
        giftNameEl.textContent = "🎁 Gift Name";

        // Reset gift count display and max draws input
        const savedGifts = localStorage.getItem("giftsData"); 
        if (savedGifts) {
            giftsForDraw = JSON.parse(savedGifts).map((g) => ({
                name: g.name || g.Gift || g.GiftName || g["Gift Name"] || g.Name || String(g).trim(),
                department: g.department || g.Department || g.Division || "General",
                image: g.image || g.ImageURL || g.Image || g.img || "",
            }));
        } else {
            giftsForDraw = [];
        }
        totalGiftsDisplay.textContent = giftsForDraw.length;
        maxDrawsInput.max = giftsForDraw.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length);

        // Restart carousel
        generateCarouselItems(); 
        resetTimeAnimation();
        clearTimeout(runNextAuto); 
        runNextAuto = setTimeout(() => {
            if(nextButton) nextButton.click();
        }, autoPlayTime);
    });

    async function runDrawSequence() {
        for (let i = 0; i < results.length; i++) {
            if (i === 0) {
                await startCountdown(10);
            } else {
                giftImageEl.classList.remove("entering", "floating"); 
                giftImageEl.classList.add("leaving");
                await sleep(500); 
                winnerCard.style.display = "none"; 
            }
            await announceWinnerSequence();
        }

        const doneMsg = document.getElementById("doneMessage");
        doneMsg.style.display = "block";

        if (typeof confetti === "function") {
            confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
        }
    }

    function startCountdown(seconds) {
        // ... (existing countdown logic) ...
        return new Promise((resolve) => {
            let count = seconds;
            loader.textContent = count;
            loader.style.display = "flex";

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    loader.textContent = count;
                } else {
                    clearInterval(timer);
                    loader.style.display = "none";
                    resolve();
                }
            }, 1000);
        });
    }

    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function announceWinnerSequence() {
        const winner = results[index];
        if (!winner) return;

        const giftObj = winner.gift;
        const giftText = (typeof giftObj === "object" && giftObj !== null) ? (giftObj.name || JSON.stringify(giftObj)) : String(giftObj);
        
        // Find the corresponding hardcoded gift data for the image
        const displayGift = gifts.find(g => g.name === giftText);

        // populate text
        winnerNameEl.textContent = `🏆 ${winner.name}`;
        idNumberEl.textContent = `🪪 ${winner.idCard}`;
        divisionNameEl.textContent = `🏢 ${winner.division || "—"}`;
        giftNameEl.textContent = `🎁 ${giftText}`;


        // ➡️ Use the hardcoded image if a match is found, otherwise use fallback
        const imageSource = (displayGift && displayGift.image && displayGift.image.trim()) 
            ? displayGift.image 
            : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">${escapeHtml(giftText || 'Gift')}</text></svg>`)}`;

        
        // Set new image and animate in
        giftImageEl.src = imageSource;
        giftImageEl.classList.remove("leaving");
        void giftImageEl.offsetWidth;
        giftImageEl.classList.add("entering");

        // Show the winner card
        winnerCard.style.display = "block";

        // Increment index for next draw
        index++;
        
        // Optional: wait a moment for the user to see the winner before the next one starts
        await sleep(6000); // 6 seconds pause before the next draw sequence starts
    }

    function escapeHtml(unsafe) {
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

</script>
</body>
</html>
