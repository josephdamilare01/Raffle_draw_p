<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎁 Animated Raffle Draw</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --accent1: #00c6ff;
      --accent2: #0072ff;
      --accent3: #00ff80;
      --dark: #071428;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin: 10px 0 16px;
      font-size: 5rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent1), var(--accent3), #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% 100%;
      animation: gradientMove 6s linear infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 100%;
      margin: 0 auto;
      padding: 10px 0 60px;
      align-items: stretch;
    }

    .top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-direction: column;
    }

    /* ✅ Edited section for wide fitted table */
    .left {
      background: rgba(255, 255, 255, 0.05);
      padding: 18px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 90px; /* makes table wide and fitted */
      border-collapse: collapse;
      background: rgba(255,255,255,0.98);
      color: #000;
      font-size: 2rem;
      border-radius: 10px;
      overflow: hidden;
      table-layout: fixed; /* ensures uniform column widths */
    }

    th, td {
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      word-break: break-word;
    }

    thead th {
      background: linear-gradient(90deg, var(--accent2), #005bb5);
      color: #fff;
      font-weight: 600;
    }
    /* ✅ End of edited section */

    .winner-card {
      width: 100%;
      max-width: 640px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.9));
      color: #000;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      position: relative;
      overflow: visible;
      display: none;
      animation: popIn 700ms ease;
      margin: 0 auto;
    }

    .winner-name {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(90deg,var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .division-name, .id-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #004aad;
      margin-bottom: 8px;
    }

    .gift-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e63946;
    }

    .gift-image-wrap {
      margin-top: 12px;
      height: 150px;
      display:flex;
      justify-content:center;
      align-items:center;
      position: relative;
      overflow: visible;
    }

    .gift-image {
      max-height: 140px;
      max-width: 260px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      transform-origin: center;
      /* start hidden — JS triggers animation class */
      opacity: 0;
    }

    /* animation for image entering */
    @keyframes moveIn {
      0% { transform: translateY(40px) scale(0.9) rotate(-6deg); opacity: 0; }
      60% { transform: translateY(-6px) scale(1.04) rotate(2deg); opacity: 1; }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    }

    /* animation for image leaving */
    @keyframes moveOut {
      0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-40px) scale(0.9) rotate(6deg); opacity: 0; }
    }

    .entering {
      animation: moveIn 700ms ease forwards;
    }
    .leaving {
      animation: moveOut 500ms ease forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      60% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); }
    }

    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
      align-items:center;
    }

    .btn {
      background: linear-gradient(90deg,var(--accent2),var(--accent1));
      border: none;
      color: #00151f;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1.5rem;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.26);
    }

    #loader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 20, 40, 0.95);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 10rem;
      font-weight: 700;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .winner-card { max-width: 100%; padding: 18px; }
      th, td { font-size: 0.95rem; padding: 10px 8px; }
      #loader { font-size: 3rem; }
    }
    /* 🎉 Done message styling */
#doneMessage {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: linear-gradient(135deg, #00c6ff, #00ff80, #ffd166);
  color: #00151f;
  font-size: 3rem;
  font-weight: 800;
  padding: 25px 40px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  text-transform: uppercase;
  animation: popUp 1s ease forwards, fadeOut 3s 4s forwards;
  z-index: 2000;
  letter-spacing: 2px;
}

/* department gallery */
.department-gallery {
  margin: 12px 0 8px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  min-height: 90px;
}

.gallery-thumb {
  width: 110px;
  height: 80px;
  border-radius: 8px;
  object-fit: cover;
  box-shadow: 0 8px 18px rgba(0,0,0,0.25);
  transform-origin:center;
  /* subtle floating animation for thumbnails */
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

/* --- NLNG Logo Styling --- */
.logo {
  position: absolute;
  top: 20px;
  left: 30px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo img {
  height: 80px;
  width: auto;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  transition: transform 0.3s ease, filter 0.3s ease;
}

.logo img:hover {
  transform: scale(1.05);
  filter: drop-shadow(0 0 8px var(--nlng-yellow));
}
@keyframes popUp {
  0% { transform: translate(-50%, -60%) scale(0.7); opacity: 0; }
  60% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@keyframes fadeOut {
  0% { opacity: 1; }
  100% { opacity: 0; display: none; }
}
  </style>
</head>
  <!-- NLNG Logo -->
<div class="logo">
  <img src="nlng-logo.png" alt="NLNG Logo">
</div>
<body>
  <h1>🎊 NLNG End of the Year Raffle Draw</h1>

  <div class="content">
    <div class="top">
      <div class="right">
        <div class="winner-card" id="winnerCard">
          <div class="winner-name" id="winnerName">🏆 Winner Name</div>
          <div class="id-name" id="idNumber">🪪 ID Card Number</div>
          <div class="division-name" id="divisionName">🏢 Division</div>
          <div class="gift-name" id="giftName">🎁 Gift</div>

          <div class="gift-image-wrap">
            <img id="giftImage" class="gift-image" src="" alt="Gift image">
          </div>
        </div>

        <div class="btns">
          <!-- department selector (populated from uploaded gifts) -->
          <select id="departmentSelect" class="btn" style="background:transparent;color:white;border:1px solid rgba(255,255,255,0.12);padding:10px;border-radius:10px;font-size:1.2rem;">
            <option value="">Select Department (All)</option>
          </select>

          <button class="btn" id="startDraw">Start Draw</button>
          <button class="btn" id="restartBtn">Restart</button>
          <button class="btn" id="homeBtn">🏠 Home</button>
        </div>
      </div>
    </div>

    <div class="left">
      <h3>🎁 Department Gifts</h3>
      <div id="gallery" class="department-gallery" aria-live="polite"></div>

      <h3 style="margin-top:18px;">🎁 Winners Table</h3>
      <table id="resultTable" aria-live="polite" style="display:none;">
        <thead>
          <tr>
            <th style="width:6%;">#</th>
            <th style="width:28%;">Participant Name</th>
            <th style="width:20%;">ID Card No.</th>
            <th style="width:26%;">Division</th>
            <th style="width:20%;">Gift</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="loader">10</div>

<script>
  let participants = [];
  let gifts = [];
  let results = [];
  let index = 0;
  const resultBody = document.querySelector("#resultTable tbody");
  const winnerCard = document.getElementById("winnerCard");
  const winnerNameEl = document.getElementById("winnerName");
  const divisionNameEl = document.getElementById("divisionName");
  const giftNameEl = document.getElementById("giftName");
  const idNumberEl = document.getElementById("idNumber");
  const loader = document.getElementById("loader");
  const giftImageEl = document.getElementById("giftImage");
  const resultTable = document.getElementById("resultTable");
  const gallery = document.getElementById("gallery");
  const departmentSelect = document.getElementById("departmentSelect");

  window.addEventListener("DOMContentLoaded", () => {
    const savedParticipants = localStorage.getItem("participantsData");
    const savedGifts = localStorage.getItem("giftsData");

    if (savedParticipants && savedGifts) {
      participants = JSON.parse(savedParticipants);
      gifts = JSON.parse(savedGifts);

      // normalize participants
      participants = participants.map((p) => ({
        name: p.name || p.Name || "Unnamed",
        division: p.division || p.Division || p.department || p.Department || "—",
        idCard: p.idCard || p["ID Card Number"] || p["ID"] || "—",
      }));

      // normalize gifts (expect upload to include columns like: GiftName / Name, Department, ImageURL)
      gifts = gifts.map((g) => ({
        name: g.name || g.Gift || g.GiftName || g["Gift Name"] || g.Name || String(g).trim(),
        department: g.department || g.Department || g.Division || "General",
        image: g.image || g.ImageURL || g.Image || g.img || "", // may be blank
      }));

      populateDepartmentSelect();
      updateGallery(); // initial gallery (All)
    } else {
      alert("⚠️ Please upload participants and gifts on the admin page first.");
    }
  });

  function populateDepartmentSelect() {
    // get unique departments from gifts
    const depts = Array.from(new Set(gifts.map(g => (g.department || "General")))).sort();
    // clear existing options except the placeholder
    departmentSelect.innerHTML = '<option value="">Select Department (All)</option>';
    depts.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      departmentSelect.appendChild(opt);
    });

    // update gallery when selection changes
    departmentSelect.addEventListener("change", () => {
      updateGallery();
    });
  }

  function updateGallery() {
    const selected = departmentSelect.value;
    // filter gifts for the gallery - only display images (if available) for selected department (or all)
    const filtered = selected ? gifts.filter(g => (g.department || "General") === selected) : gifts;
    gallery.innerHTML = "";

    if (!filtered.length) {
      gallery.innerHTML = '<div style="opacity:0.8;color:#ddd;width:100%;text-align:center;padding:12px;">No gifts uploaded for this department.</div>';
      return;
    }

    filtered.forEach(g => {
      const img = document.createElement("img");
      img.className = "gallery-thumb";
      img.alt = g.name || "gift";
      if (g.image && g.image.trim()) {
        img.src = g.image;
      } else {
        // fallback to a placeholder data URI (simple colored box) to avoid broken images
        img.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="100%" height="100%" fill="#e6f7ff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="18" fill="#004aad">${escapeHtml(g.name || 'Gift')}</text></svg>`)}`;
      }
      // clicking thumbnail selects department/gift preview
      img.title = g.name;
      gallery.appendChild(img);
    });
  }

  document.getElementById("startDraw").addEventListener("click", async () => {
    if (!participants.length || !gifts.length) {
      alert("Upload both participant and gift data first.");
      return;
    }

    // use only gifts from the selected department when drawing
    const selectedDept = departmentSelect.value;
    const usableGifts = selectedDept ? gifts.filter(g => (g.department || "General") === selectedDept) : gifts.slice();

    if (!usableGifts.length) {
      alert("No gifts available for the selected department. Please select another department or upload gifts.");
      return;
    }

    const numDraws = Math.min(participants.length, usableGifts.length);
    // shuffle participants & gifts
    const shuffledParticipants = [...participants].sort(() => 0.5 - Math.random());
    const shuffledGifts = [...usableGifts].sort(() => 0.5 - Math.random());

    results = [];
    for (let i = 0; i < numDraws; i++) {
      results.push({
        name: shuffledParticipants[i].name,
        division: shuffledParticipants[i].division,
        idCard: shuffledParticipants[i].idCard,
        gift: shuffledGifts[i], // gift is an object with name/department/image
      });
    }

    // clear previous results
    resultBody.innerHTML = "";
    // hide result table until we add first row (it will be shown in announceWinner)
    resultTable.style.display = "none";
    index = 0;
    runDrawSequence();
  });

  document.getElementById("homeBtn").addEventListener("click", () => {
    window.location.href = "/index.html"; // ✅ Works both locally and on Vercel
  });

  // restart simply reloads the page / state
  document.getElementById("restartBtn").addEventListener("click", () => {
    // hide winner UI, reset results (keeps uploaded data)
    results = [];
    index = 0;
    resultBody.innerHTML = "";
    resultTable.style.display = "none";
    winnerCard.style.display = "none";
    giftImageEl.src = "";
  });

  async function runDrawSequence() {
    for (let i = 0; i < results.length; i++) {
      if (i === 0) {
        await startCountdown(10);
      } else {
        await sleep(1000);
      }
      await announceWinnerSequence(); // await so animations complete
    }

    // 🎉 Show animated message after all draws
    const doneMsg = document.getElementById("doneMessage");
    doneMsg.style.display = "block";

    // 🎊 Optional confetti burst for finale
    if (typeof confetti === "function") {
      confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
    }
  }

  function startCountdown(seconds) {
    return new Promise((resolve) => {
      let count = seconds;
      loader.textContent = count;
      loader.style.display = "flex";

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          loader.textContent = count;
        } else {
          clearInterval(timer);
          loader.style.display = "none";
          resolve();
        }
      }, 1000);
    });
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function announceWinnerSequence() {
    const winner = results[index];
    if (!winner) return;

    // populate text
    winnerNameEl.textContent = `🏆 ${winner.name}`;
    idNumberEl.textContent = `🪪 ${winner.idCard}`;
    divisionNameEl.textContent = `🏢 ${winner.division || "—"}`;
    // gift may be object or string
    const giftObj = winner.gift;
    const giftText = (typeof giftObj === "object" && giftObj !== null) ? (giftObj.name || JSON.stringify(giftObj)) : String(giftObj);
    giftNameEl.textContent = `🎁 ${giftText}`;

    // set image (if available)
    if (typeof giftObj === "object" && giftObj.image && giftObj.image.trim()) {
      giftImageEl.src = giftObj.image;
    } else {
      // fallback small SVG placeholder with gift name
      giftImageEl.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">${escapeHtml(giftText)}</text></svg>`)}`;
    }

    // show and animate
    winnerCard.style.display = "block";
    // reset classes
    giftImageEl.classList.remove("entering", "leaving");
    // small delay to ensure reflow then add entering
    void giftImageEl.offsetWidth;
    giftImageEl.classList.add("entering");

    // confetti for each winner
    if (typeof confetti === "function") {
      confetti({ particleCount: 130, spread: 80, origin: { y: 0.55 } });
    }

    // add to table now and show table if hidden
    const rowHtml = `<tr>
        <td>${index + 1}</td>
        <td>${escapeHtml(winner.name)}</td>
        <td>${escapeHtml(winner.idCard)}</td>
        <td>${escapeHtml(winner.division || "—")}</td>
        <td>${escapeHtml(giftText)}</td>
      </tr>`;
    resultBody.insertAdjacentHTML("beforeend", rowHtml);
    resultTable.style.display = ""; // show table

    // scroll to results smoothly
    document.querySelector("#resultTable").scrollIntoView({ behavior: "smooth", block: "end" });

    // let the image stay visible a bit
    await sleep(2200);

    // animate image leaving
    giftImageEl.classList.remove("entering");
    giftImageEl.classList.add("leaving");

    // wait for leaving animation to finish
    await sleep(520);

    // hide winner card briefly between draws (so next draw can pop in)
    winnerCard.style.display = "none";
    giftImageEl.classList.remove("leaving");
    index++;
    // allow a short pause between winners
    await sleep(400);
  }

  function escapeHtml(text = "") {
    return String(text).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>
<div id="doneMessage">✅ Done Drawing!</div>
</body>
</html>
