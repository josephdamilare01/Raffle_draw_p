<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎁 NLNG End of Year Raffle Draw</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
:root {
  --accent1: #00c6ff;
  --accent2: #0072ff;
  --accent3: #00ff80;
  --dark: #0a0f1c;
  --glass: rgba(255,255,255,0.15);
}
html, body {
  height: 100%;
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* Header */
h1 {
  margin: 20px 0 25px;
  font-size: 3rem;
  background: linear-gradient(90deg, var(--accent1), var(--accent3), #ffd166);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% 100%;
  animation: gradientMove 6s linear infinite;
}
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Controls */
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin-bottom: 25px;
}
.controls select, .controls input {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-size: 1rem;
  font-weight: 500;
  outline: none;
  background: var(--glass);
  color: white;
  backdrop-filter: blur(10px);
}
.controls select option { color: #000; }

.btn {
  background: linear-gradient(90deg, var(--accent2), var(--accent1));
  border: none;
  color: #fff;
  padding: 12px 25px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 1.2rem;
  cursor: pointer;
  transition: all .3s ease;
}
.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

/* Rolling Text */
#rollingBox {
  display: none;
  font-size: 2.5rem;
  margin: 25px auto;
  font-weight: 700;
  color: var(--accent3);
  text-shadow: 0 0 10px var(--accent3);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.05); }
}

/* Winner Card */
.winner-card {
  display: none;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border: 2px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
  max-width: 700px;
  margin: 0 auto 30px;
  animation: popIn 0.7s ease;
}
@keyframes popIn {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.winner-card img {
  width: 350px;
  height: 350px;
  object-fit: contain;
  margin: 20px auto;
  display: block;
  border-radius: 18px;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 25px rgba(255,255,255,0.3);
}
.winner-name {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 5px;
  background: linear-gradient(90deg,var(--accent2), var(--accent3));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.winner-dept, .winner-id, .winner-gift {
  font-size: 1.3rem;
  margin: 6px 0;
}

/* Result Table */
.table-container {
  width: 90%;
  margin: 0 auto;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  color: #fff;
  border-radius: 12px;
  overflow: hidden;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}
th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
thead th {
  background: linear-gradient(90deg, var(--accent2), var(--accent1));
  color: white;
}
tr:hover td {
  background: rgba(255,255,255,0.1);
}
</style>
</head>

<body>
  <h1>🎊 NLNG End of Year Raffle Draw</h1>

  <div class="controls">
    <select id="departmentFilter"><option value="">All Departments</option></select>
    <input type="number" id="numDraws" placeholder="Number of Winners" min="1" />
    <button class="btn" id="startDraw">Start Draw</button>
  </div>

  <div id="rollingBox">🎡 Rolling...</div>

  <div class="winner-card" id="winnerCard">
    <h2 class="winner-name" id="winnerName">🏆 Winner</h2>
    <div class="winner-dept" id="winnerDept"></div>
    <div class="winner-id" id="winnerId"></div>
    <img id="giftImage" src="" alt="Gift Image" />
    <div class="winner-gift" id="giftName">🎁 Gift</div>
  </div>

  <div class="table-container">
    <table id="resultTable">
      <thead><tr><th>#</th><th>Name</th><th>Department</th><th>ID</th><th>Gift</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
let participants = [];
let gifts = [];
let departments = new Set();
let resultList = [];
const giftImageMap = {}; // maps gift names to image URLs
// Request fullscreen when draw starts
function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) { /* Safari */
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) { /* IE11 */
    elem.msRequestFullscreen();
  }
}

// Exit fullscreen (optional)
function exitFullscreen() {
  if (document.exitFullscreen) {
    document.exitFullscreen();
  } else if (document.webkitExitFullscreen) { /* Safari */
    document.webkitExitFullscreen();
  } else if (document.msExitFullscreen) { /* IE11 */
    document.msExitFullscreen();
  }
}

// Trigger fullscreen at the start of the draw
document.getElementById("startDraw").addEventListener("click", () => {
  enterFullscreen();
});

window.addEventListener("DOMContentLoaded", () => {
  // Load uploaded data from localStorage (from upload page)
  const savedParticipants = localStorage.getItem("participantsData");
  const savedGifts = localStorage.getItem("giftsData");
  const savedGiftImages = localStorage.getItem("giftImageMap");

  if (savedParticipants) participants = JSON.parse(savedParticipants);
  if (savedGifts) gifts = JSON.parse(savedGifts);
  if (savedGiftImages) Object.assign(giftImageMap, JSON.parse(savedGiftImages));

  participants.forEach(p => departments.add(p.Department || p.Division || "—"));
  updateDepartmentDropdown();
});

function updateDepartmentDropdown() {
  const select = document.getElementById("departmentFilter");
  select.innerHTML = '<option value="">All Departments</option>' +
    [...departments].map(d => `<option value="${d}">${d}</option>`).join("");
}

document.getElementById("startDraw").addEventListener("click", startDraw);

function startDraw() {
  const num = parseInt(document.getElementById("numDraws").value) || 1;
  const selectedDept = document.getElementById("departmentFilter").value;
  let availableNames = selectedDept ? participants.filter(p => (p.Department || p.Division) === selectedDept) : [...participants];

  if (!availableNames.length || !gifts.length) {
    alert("⚠️ Please ensure participants and gifts are uploaded and available.");
    return;
  }

  const winnersCount = Math.min(num, availableNames.length, gifts.length);
  resultList = [];

  for (let i = 0; i < winnersCount; i++) {
    const pIndex = Math.floor(Math.random() * availableNames.length);
    const gIndex = Math.floor(Math.random() * gifts.length);
    const person = availableNames.splice(pIndex, 1)[0];
    const gift = gifts.splice(gIndex, 1)[0];
    resultList.push({...person, gift});
  }

  runAnimatedDraw();
}

async function runAnimatedDraw() {
  for (let winner of resultList) {
    await animateDraw(winner);
    await sleep(2000);
  }
  confetti({ particleCount: 300, spread: 100, origin:{y:0.6}});
}

async function animateDraw(winner) {
  const rollBox = document.getElementById("rollingBox");
  const card = document.getElementById("winnerCard");
  const img = document.getElementById("giftImage");
  rollBox.style.display = "block";
  card.style.display = "none";

  for (let speed = 100; speed >= 25; speed -= 10) {
    const rand = participants[Math.floor(Math.random() * participants.length)];
    rollBox.textContent = `🎡 ${rand?.Name || rand?.name || "Rolling..."}`;
    await sleep(speed);
  }

  rollBox.style.display = "none";
  document.getElementById("winnerName").textContent = `🏆 ${winner.Name || winner.name}`;
  document.getElementById("winnerDept").textContent = `🏢 ${winner.Department || winner.Division}`;
  document.getElementById("winnerId").textContent = `🪪 ${winner["ID Card Number"] || winner.ID}`;
  document.getElementById("giftName").textContent = `🎁 ${winner.gift}`;

  const giftImg = giftImageMap[winner.gift?.toLowerCase()] || "images/default.png";
  img.src = giftImg;

  card.style.display = "block";
  appendToTable(winner);
  confetti({ particleCount: 180, spread: 90, origin:{y:0.6}});
}

function appendToTable(winner) {
  const tbody = document.querySelector("#resultTable tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${tbody.children.length+1}</td>
                  <td>${winner.Name || winner.name}</td>
                  <td>${winner.Department || winner.Division}</td>
                  <td>${winner["ID Card Number"] || winner.ID}</td>
                  <td>${winner.gift}</td>`;
  tbody.appendChild(tr);
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
