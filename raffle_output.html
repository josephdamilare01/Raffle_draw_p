<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎁 Animated Raffle Draw</title>

    <style>
        :root {
            --accent1: #00c6ff;
            --accent2: #0072ff;
            --accent3: #00ff80;
            --dark: #071428;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin: 10px 0 16px;
            font-size: 5rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent1), var(--accent3), #ffd166);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 100%;
            animation: gradientMove 6s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px 0 60px;
            align-items: stretch;
        }

        .top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-direction: column;
        }

        /* Table container (kept for structure, but table itself is hidden) */
        .left {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 90px;
            border-collapse: collapse;
            background: rgba(255,255,255,0.98);
            color: #000;
            font-size: 2rem;
            border-radius: 10px;
            overflow: hidden;
            table-layout: fixed;
        }

        th, td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            word-break: break-word;
        }

        thead th {
            background: linear-gradient(90deg, var(--accent2), #005bb5);
            color: #fff;
            font-weight: 600;
        }

        /* ➡️ IMPROVEMENT 1: Increased max-width for prominence */
        .winner-card {
            width: 100%;
            max-width: 800px; 
            background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.9));
            color: #000;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            position: relative;
            overflow: visible;
            display: none;
            animation: popIn 700ms ease;
            margin: 0 auto;
        }

        .winner-name {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(90deg,var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .division-name, .id-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #004aad;
            margin-bottom: 8px;
        }

        .gift-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e63946;
        }

        /* ➡️ IMPROVEMENT 2: Increased size for gift image */
        .gift-image-wrap {
            margin-top: 20px;
            height: 250px; 
            display:flex;
            justify-content:center;
            align-items:center;
            position: relative;
            overflow: visible;
        }

        .gift-image {
            max-height: 240px; /* Increased max height */
            max-width: 400px; /* Increased max width */
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.35);
            transform-origin: center;
            opacity: 0;
        }

        /* animation for image entering */
        @keyframes moveIn {
            0% { transform: translateY(40px) scale(0.9) rotate(-6deg); opacity: 0; }
            60% { transform: translateY(-6px) scale(1.04) rotate(2deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        /* animation for image leaving */
        @keyframes moveOut {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-40px) scale(0.9) rotate(6deg); opacity: 0; }
        }

        /* NEW: Animation for continuous subtle floating */
        @keyframes floatHorizontal {
            0% { transform: translateX(0px); }
            50% { transform: translateX(8px); }
            100% { transform: translateX(0px); }
        }

        .entering {
            animation: moveIn 700ms ease forwards;
        }
        .leaving {
            animation: moveOut 500ms ease forwards;
        }
        .floating { /* NEW class for continuous floating */
            animation: floatHorizontal 4s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            60% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); }
        }

        .btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
            align-items:center;
        }

        .btn {
            background: linear-gradient(90deg,var(--accent2),var(--accent1));
            border: none;
            color: #00151f;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform .14s ease, box-shadow .14s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.26);
        }

        #loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 20, 40, 0.95);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 10rem;
            font-weight: 700;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .winner-card { max-width: 100%; padding: 18px; }
            th, td { font-size: 0.95rem; padding: 10px 8px; }
            #loader { font-size: 3rem; }
        }

        #doneMessage {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #00c6ff, #00ff80, #ffd166);
            color: #00151f;
            font-size: 3rem;
            font-weight: 800;
            padding: 25px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            text-transform: uppercase;
            animation: popUp 1s ease forwards, fadeOut 3s 4s forwards;
            z-index: 2000;
            letter-spacing: 2px;
        }

        /* department gallery */
        .department-gallery {
            margin: 12px 0 8px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 90px;
        }

        .gallery-thumb {
            width: 200px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
            transform-origin:center;
            cursor: pointer; /* Added cursor for better UX */
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* --- NLNG Logo Styling --- */
        .logo {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 80px;
            width: auto;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 8px var(--nlng-yellow));
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -60%) scale(0.7); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</head>
 <body>

        { name: "hisense 20 litres microwave (h20mows14)", department: "Train 7", image: "hisense 20 litres microwave (h20mows14).jpg" },

    let fullParticipants = [];
    let fullGifts = [];
    let participants = [];
    let gifts = giftsHardcoded; // For display/preview
    let giftsForDraw = [];      // For drawing (loaded from localStorage)
    let results = [];
    let index = 0;
    
    // DOM elements
    const resultBody = document.querySelector("#resultTable tbody");
    const winnerCard = document.getElementById("winnerCard");
    const winnerNameEl = document.getElementById("winnerName");
    const divisionNameEl = document.getElementById("divisionName");
    const giftNameEl = document.getElementById("giftName");

    // Function to populate department selector with ALL available departments
    function populateDepartmentSelector() {
        const select = document.getElementById("departmentSelect");
        select.innerHTML = '<option value="">Select Department (All)</option>';
        
        // Get unique departments from ALL sources: hardcoded gifts, uploaded participants, and uploaded gifts
        const hardcodedDepts = [...new Set(giftsHardcoded.map(g => g.department))];
        const participantDepts = [...new Set(fullParticipants.map(p => p.department))];
        const giftDepts = [...new Set(fullGifts.map(g => g.department))];
        
        // Combine all departments and remove duplicates
        const allDepartments = [...new Set([...hardcodedDepts, ...participantDepts, ...giftDepts])].filter(dept => dept && dept.trim() !== "");
        
        allDepartments.sort().forEach(dep => {
            const option = document.createElement("option");
            option.value = dep;
            option.textContent = dep;
            select.appendChild(option);
        });

        console.log("Available departments:", allDepartments);
    }

    // Function to load gallery
    function loadGallery(giftsArray) {
        gallery.innerHTML = "";
        
        if (!giftsArray || giftsArray.length === 0) {
            gallery.innerHTML = '<div style="opacity:0.8;color:#ddd;width:100%;text-align:center;padding:12px;">No gifts available for this department.</div>';
            return;
        }

        giftsArray.forEach(g => {
            const img = document.createElement("img");
            img.className = "gallery-thumb";
            img.alt = g.name || "gift";
            
            if (g.image && g.image.trim()) {
                img.src = g.image;
            } else {
                img.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="100%" height="100%" fill="#e6f7ff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="18" fill="#004aad">${escapeHtml(g.name || 'Gift')}</text></svg>`)}`;
            }
            
            img.title = g.name;
            img.addEventListener('click', () => {
                previewGift(g);
            });

            gallery.appendChild(img);
        });
    }

    // IMPROVED Function to filter all data by department
    function filterAllByDepartment(dept) {
        if (!dept || dept.trim() === "") {
            console.log("No department selected - showing ALL data");
            return {
                participants: fullParticipants,
                giftsForDraw: fullGifts,
                hardcodedGifts: giftsHardcoded
            };
        }

        console.log(`🎁 Full gifts for draw count:`, fullGifts.length);

            const participantDept = String(p.department || p.division || p.Department || p.Division || "").toLowerCase().trim();

        });

            if (matches) {
                console.log(`✅ Gift MATCH: ${g.name} - Department: "${giftDept}"`);
            }
            return matches;
        });
        
        // Filter hardcoded gifts
        const filteredHardcodedGifts = giftsHardcoded.filter(g => {

    // IMPROVED data normalization functions
    function normalizeParticipantData(participant) {
        // Extract department from any possible column name
        let department = participant.department || participant.Department || 
                        participant.division || participant.Division || 
                        participant["Department"] || "General";
        
        // Clean up department name
        department = department.toString().trim();
        
        return {
            name: participant.name || participant.Name || participant.Participant || "Unnamed",
            division: participant.division || participant.Division || department || "—",
            idCard: participant.idCard || participant["ID Card Number"] || participant["ID CARD NO"] || participant.ID || participant["ID"] || "—",
            department: department
        };
    }

    function normalizeGiftData(gift) {
        // Extract department from any possible column name
        let department = gift.department || gift.Department || 
                        gift.division || gift.Division || 
                        gift["Department"] || "General";
        
        // Clean up department name
        department = department.toString().trim();
        
        return {
            name: gift.name || gift.Name || gift.Gift || gift.GiftName || gift["Gift Name"] || String(gift).trim(),
            department: department,
            image: gift.image || gift.ImageURL || gift.Image || gift.img || "",
        };
    }

    // IMPROVED initialization
    window.addEventListener("DOMContentLoaded", () => {
        const savedParticipants = localStorage.getItem("participantsData");
        const savedGifts = localStorage.getItem("giftsData");

        console.log("🚀 INITIALIZING PAGE...");
        
        // Load participants
        if (savedParticipants) {
            const parsedParticipants = JSON.parse(savedParticipants);
            console.log("📥 Raw participants data (first 3):", parsedParticipants.slice(0, 3));
            
            fullParticipants = parsedParticipants.map(normalizeParticipantData);
            participants = [...fullParticipants];
            
            console.log("✅ Normalized participants (first 3):", fullParticipants.slice(0, 3));
            console.log(`📊 Total participants loaded: ${fullParticipants.length}`);
            
            // Show department distribution
            const deptCount = {};
            fullParticipants.forEach(p => {
                deptCount[p.department] = (deptCount[p.department] || 0) + 1;
            });
            console.log("👥 Participant department distribution:", deptCount);
        } else {
            alert("⚠️ Please upload participants on the admin page first.");
        }

        // Load gifts for draw
        if (savedGifts) {
            const parsedGifts = JSON.parse(savedGifts);
            console.log("📥 Raw gifts data (first 3):", parsedGifts.slice(0, 3));
            
            fullGifts = parsedGifts.map(normalizeGiftData);
            giftsForDraw = [...fullGifts];
            
            console.log("✅ Normalized gifts for draw (first 3):", giftsForDraw.slice(0, 3));
            console.log(`🎁 Total gifts for draw loaded: ${giftsForDraw.length}`);
            
            // Show department distribution
            const giftDeptCount = {};
            giftsForDraw.forEach(g => {
                giftDeptCount[g.department] = (giftDeptCount[g.department] || 0) + 1;
            });
            console.log("🎁 Gift department distribution:", giftDeptCount);
        } else {
            alert("⚠️ Please upload the gift list (for drawing) on the admin page first.");
        }

        // Initialize UI
        populateDepartmentSelector();
        loadGallery(giftsHardcoded);
        
        // Update counters
        totalGiftsDisplay.textContent = giftsForDraw.length;
        maxDrawsInput.max = giftsForDraw.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length);

        console.log("✅ PAGE INITIALIZATION COMPLETE");
    });

    // IMPROVED department filter event listener
    departmentSelect.addEventListener("change", function() {
        const dept = this.value;
        console.log(`\n🎯 DEPARTMENT CHANGED: "${dept}"`);
        
        const filtered = filterAllByDepartment(dept);
        
        // Update global arrays with filtered data
        participants = filtered.participants;
        giftsForDraw = filtered.giftsForDraw;
        gifts = filtered.hardcodedGifts;

        console.log("📋 FINAL FILTERED DATA:");
        console.log("   👥 Participants:", participants.length);
        console.log("   🎁 Gifts for draw:", giftsForDraw.length);
        console.log("   🖼️  Hardcoded gifts:", gifts.length);

        // Update gallery and counters
        loadGallery(gifts);
        totalGiftsDisplay.textContent = giftsForDraw.length;
        maxDrawsInput.max = giftsForDraw.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length);
        
        // Show summary alert for debugging
        if (dept && giftsForDraw.length === 0) {
            setTimeout(() => {
                const availableDepts = [...new Set(fullGifts.map(g => g.department))];
                alert(`⚠️ No gifts found for department: "${dept}"\n\nAvailable departments in gifts:\n- ${availableDepts.join('\n- ')}`);
            }, 100);
        }
    });

    // Function to Preview a Gift
    async function previewGift(giftObj) {
        winnerCard.style.display = "block";
        winnerNameEl.textContent = "🎁 Gift Preview";
        idNumberEl.textContent = `Department: ${giftObj.department || "General"}`;
        divisionNameEl.textContent = "Click 'Start Draw' to begin!";
        giftNameEl.textContent = `Featured Gift: ${giftObj.name}`;

        const giftImageSrc = (giftObj.image && giftObj.image.trim()) 
            ? giftObj.image 
            : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">${escapeHtml(giftObj.name || 'Gift')}</text></svg>`)}`;
        
        // Animation handling
        if (giftImageEl.classList.contains("entering") || giftImageEl.classList.contains("floating")) {
            giftImageEl.classList.remove("entering", "floating");
            giftImageEl.classList.add("leaving");
            await sleep(500);
        } else if (giftImageEl.classList.contains("leaving")) {
            await sleep(500);
        }

        giftImageEl.src = giftImageSrc;
        giftImageEl.classList.remove("leaving");
        void giftImageEl.offsetWidth;
        giftImageEl.classList.add("entering");

        setTimeout(() => {
            giftImageEl.classList.remove("entering");
            giftImageEl.classList.add("floating");
        }, 700);
    }

    // Event listeners
    document.getElementById("startDraw").addEventListener("click", async () => {
        if (!participants.length) {
            alert("No participants available for the selected department.");
            return;
        }
        
        if (!giftsForDraw.length) {
            alert("No gifts available for drawing in the selected department.");
            return;
        }

        const desiredDraws = parseInt(maxDrawsInput.value, 10);
        if (isNaN(desiredDraws) || desiredDraws < 1) {
            alert("Please enter a valid number of draws (1 or more).");
            return;
        }

        const usableGifts = giftsForDraw.slice();
        const numDraws = Math.min(participants.length, usableGifts.length, desiredDraws);

        if (numDraws === 0) {
            alert("Cannot run draw. Check participant count, gift count, and desired draws input.");
            return;
        }

        const shuffledParticipants = [...participants].sort(() => 0.5 - Math.random());
        const shuffledGifts = [...usableGifts].sort(() => 0.5 - Math.random());

        results = [];
        for (let i = 0; i < numDraws; i++) {
            results.push({
                name: shuffledParticipants[i].name,
                division: shuffledParticipants[i].division,
                idCard: shuffledParticipants[i].idCard,
                gift: shuffledGifts[i], 
            });
        }

        resultBody.innerHTML = "";
        index = 0;

        giftImageEl.classList.remove("floating"); 
        runDrawSequence();

        totalGiftsDisplay.textContent = giftsForDraw.length - results.length;
        maxDrawsInput.max = giftsForDraw.length - results.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length - results.length);
    });

    document.getElementById("homeBtn").addEventListener("click", () => {
        window.location.href = "/index.html";
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
        results = [];
        index = 0;
        resultBody.innerHTML = "";
        resultTable.style.display = "none";
        winnerCard.style.display = "none";
        
        giftImageEl.src = "";
        giftImageEl.classList.remove("entering", "leaving", "floating");

        winnerNameEl.textContent = "🎁 Gift Preview / 🏆 Winner Name";
        idNumberEl.textContent = "🪪 ID Card Number";
        divisionNameEl.textContent = "🏢 Division";
        giftNameEl.textContent = "🎁 Gift Name";

        // Reset to full datasets
        const savedParticipants = localStorage.getItem("participantsData");
        const savedGifts = localStorage.getItem("giftsData"); 
        
        if (savedParticipants) {
            const parsedParticipants = JSON.parse(savedParticipants);
            fullParticipants = parsedParticipants.map(normalizeParticipantData);
            participants = [...fullParticipants];
        }
        
        if (savedGifts) {
            const parsedGifts = JSON.parse(savedGifts);
            fullGifts = parsedGifts.map(normalizeGiftData);
            giftsForDraw = [...fullGifts];
        } else {
            giftsForDraw = [];
        }
        
        // Reset department selector to "All"
        departmentSelect.value = "";
        
        // Update gallery and counters
        loadGallery(giftsHardcoded);
        totalGiftsDisplay.textContent = giftsForDraw.length;
        maxDrawsInput.max = giftsForDraw.length;
        maxDrawsInput.value = Math.min(1, giftsForDraw.length);
        
        console.log("🔄 SYSTEM RESET - All data restored to full datasets");
    });

    // Rest of your existing functions remain the same...
    async function runDrawSequence() {
        for (let i = 0; i < results.length; i++) {
            if (i === 0) {
                await startCountdown(10);
            } else {
                giftImageEl.classList.remove("entering", "floating");
                giftImageEl.classList.add("leaving");
                await sleep(500);
                winnerCard.style.display = "none";
            }
            await announceWinnerSequence();
        }

        const doneMsg = document.getElementById("doneMessage");
        doneMsg.style.display = "block";

        if (typeof confetti === "function") {
            confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
        }
    }

    function startCountdown(seconds) {
        return new Promise((resolve) => {
            let count = seconds;
            loader.textContent = count;
            loader.style.display = "flex";

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    loader.textContent = count;
                } else {
                    clearInterval(timer);
                    loader.style.display = "none";
                    resolve();
                }
            }, 1000);
        });
    }

    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function announceWinnerSequence() {
        const winner = results[index];
        if (!winner) return;

        const giftObj = winner.gift;
        const giftText = (typeof giftObj === "object" && giftObj !== null) ? (giftObj.name || JSON.stringify(giftObj)) : String(giftObj);
        
        const displayGift = gifts.find(g => g.name === giftText);

        winnerNameEl.textContent = `🏆 ${winner.name}`;
        idNumberEl.textContent = `🪪 ${winner.idCard}`;
        divisionNameEl.textContent = `🏢 ${winner.division || "—"}`;
        giftNameEl.textContent = `🎁 ${giftText}`;

        const imageSource = (displayGift && displayGift.image && displayGift.image.trim()) 
            ? displayGift.image 
            : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">${escapeHtml(giftText)}</text></svg>`)}`;
        
        giftImageEl.src = imageSource;
        winnerCard.style.display = "block";
        
        giftImageEl.classList.remove("leaving", "floating");
        void giftImageEl.offsetWidth;
        giftImageEl.classList.add("entering");

        if (typeof confetti === "function") {
            confetti({ particleCount: 130, spread: 80, origin: { y: 0.55 } });
        }

        const rowHtml = `<tr>
            <td>${index + 1}</td>
            <td>${escapeHtml(winner.name)}</td>
            <td>${escapeHtml(winner.idCard)}</td>
            <td>${escapeHtml(winner.division || "—")}</td>
            <td>${escapeHtml(giftText)}</td>
        </tr>`;
        resultBody.insertAdjacentHTML("beforeend", rowHtml);
        
        if (index === 0) {
            resultTable.style.display = "table";
        }
        
        index++;
        await sleep(4000);
    }

    function escapeHtml(unsafe) {
        if (typeof unsafe !== 'string') return unsafe;
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
