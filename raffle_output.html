<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎁 Animated Raffle Draw</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="carousel.css"> 
    
    <style>
        /* Existing Raffle Draw CSS (Only showing relevant context for integration) */
        :root {
            --accent1: #00c6ff;
            --accent2: #0072ff;
            --accent3: #00ff80;
            --dark: #071428;
            /* ➡️ NEW: Added variable for raffle Z-index to ensure it sits above the carousel */
            --raffle-z-index: 100;
            --main-font: "Poppins", sans-serif;
            --card-bg: rgba(255, 255, 255, 0.1);
            --btn-bg: var(--accent2);
            --btn-hover-bg: var(--accent1);
            --transition-speed: 0.3s;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: var(--main-font);
            background: radial-gradient(circle at 10% 20%, #081028, #071428 30%, #0b2a3a 60%, #071428 100%);
            color: white;
            text-align: center;
            overflow-x: hidden;
            /* ➡️ NEW: Added transition for smooth visibility change */
            transition: opacity 0.5s ease; 
        }

        /* ➡️ NEW: Style for the main raffle container */
        .raffle-container {
            position: relative; /* Keeps it layered */
            z-index: var(--raffle-z-index);
            transition: opacity 0.5s ease;
            min-height: 100vh; /* Ensure it takes up the full viewport height */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px; /* Space for the bottom controls */
        }
        
        /* ⬇️ Existing Styles continue... (Full Styles for the Raffle UI) ⬇️ */

        h1 {
            color: var(--accent1);
            margin-top: 50px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: calc(var(--raffle-z-index) + 10); /* Ensure logo is always on top */
        }

        .logo img {
            height: 80px; /* Adjust size as needed */
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .content {
            display: flex;
            flex-direction: column; /* Changed to column for better responsiveness base */
            width: 95%;
            max-width: 1400px;
            margin: 30px auto 0;
            gap: 30px;
        }

        .top {
            display: flex;
            flex-direction: row; /* Main area is row on large screen */
            gap: 30px;
            width: 100%;
        }

        .left, .right {
            flex: 1;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
        }
        
        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .winner-card {
            background: linear-gradient(135deg, #1f2a40, #0a1428);
            border: 3px solid var(--accent3);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.5);
            width: 100%;
            max-width: 450px;
            transition: all 0.5s ease-in-out;
            position: relative;
        }

        .winner-name, .id-name, .division-name, .gift-name {
            font-size: 1.5rem;
            margin: 10px 0;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .winner-name {
            font-size: 2.2rem;
            color: var(--accent1);
            text-shadow: 0 0 15px rgba(0, 198, 255, 0.8);
        }

        .gift-image-wrap {
            height: 300px;
            width: 100%;
            margin-top: 20px;
            overflow: hidden;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gift-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out, transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* For entering/leaving */
        }
        
        /* Image Animations */
        .gift-image.entering {
            opacity: 0;
            transform: scale(0.5) rotateY(90deg);
        }

        .gift-image-wrap:has(.gift-image.entering) .gift-image {
             opacity: 1;
             transform: scale(1) rotateY(0deg);
        }
        
        .gift-image.leaving {
            opacity: 0;
            transform: scale(1.5) rotate(10deg);
        }
        
        .gift-image.floating {
            /* Continuous subtle floating animation */
            animation: float 5s ease-in-out infinite alternate;
        }
        
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }


        .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: var(--btn-bg);
            color: white;
            transition: background var(--transition-speed), transform var(--transition-speed);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        
        /* Select and Input styling */
        #departmentSelect, #maxDrawsInput {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px;
            border-radius: 10px;
            font-size: 1.2rem;
            width: 200px;
            text-align: center;
            box-shadow: none;
            -webkit-appearance: none; /* Remove default arrow on select */
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23fff' d='M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 0.8em auto;
        }
        
        #maxDrawsInput {
            width: 150px;
        }
        
        #departmentSelect option {
            background: var(--dark);
            color: white;
        }


        /* Gallery and Table Styles */
        .department-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 350px;
            overflow-y: auto;
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .gallery-thumb {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .gallery-thumb:hover {
            border-color: var(--accent3);
            transform: scale(1.05);
        }

        /* Winners Table */
        #resultTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
        }

        th {
            background: var(--accent2);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.03);
        }
        
        /* Loader/Countdown */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 20, 40, 0.95);
            z-index: calc(var(--raffle-z-index) + 50);
            display: none; /* Initially hidden */
            justify-content: center;
            align-items: center;
            font-size: 8rem;
            color: var(--accent3);
            font-weight: bold;
            text-shadow: 0 0 20px rgba(0, 255, 128, 0.8);
            animation: countdown-pulse 1s infinite alternate;
        }

        @keyframes countdown-pulse {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        #doneMessage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: calc(var(--raffle-z-index) + 50);
            font-size: 4rem;
            color: gold;
            text-shadow: 0 0 20px yellow;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            border: 3px solid gold;
        }
        
        /* ⬆️ Existing Styles continue... (Full Styles for the Raffle UI) ⬆️ */

        /* ➡️ NEW: Media Query for smaller screens (adjusting raffle elements) */
        @media (max-width: 1200px) {
            .top {
                flex-direction: column;
            }
            .right {
                order: 1; /* Move winner card to the top on small screens */
            }
            .left {
                order: 2;
            }
        }

        @media (max-width: 640px) {
            h1 { font-size: 2rem; margin-top: 30px; }
            .logo img { height: 60px; }
            .winner-card { max-width: 100%; padding: 18px; }
            .winner-name { font-size: 1.8rem; }
            .id-name, .division-name, .gift-name { font-size: 1.2rem; }
            .gift-image-wrap { height: 200px; }
            th, td { font-size: 0.8rem; padding: 8px 5px; }
            #loader { font-size: 6rem; }
            .btn { font-size: 1rem; padding: 10px 20px; }
            #departmentSelect, #maxDrawsInput { font-size: 1rem; width: 100%; max-width: 250px; }
            .btns { flex-direction: column; }
        }

        /* ➡️ NEW: Hidden utility class for the toggle functionality */
        .hidden-raffle {
            opacity: 0;
            pointer-events: none;
            height: 0;
            overflow: hidden;
            /* The carousel will be placed behind this, so no Z-index change needed here */
        }
        
    </style>
</head>

            const depts = Array.from(new Set(gifts.map(g => (g.department || "General")))).sort();
            departmentSelect.innerHTML = '<option value="">Select Department (All)</option>';
            depts.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d;
                opt.textContent = d;
                departmentSelect.appendChild(opt);
            });

            departmentSelect.addEventListener("change", () => {
                updateGallery();
            });
        }

        function updateGallery() {
            const selected = departmentSelect.value;
            // Uses hardcoded gifts (gifts) to filter gallery
            const filtered = selected ? gifts.filter(g => (g.department || "General") === selected) : gifts;
            gallery.innerHTML = "";

            if (!filtered.length) {
                gallery.innerHTML = '<div style="opacity:0.8;color:#ddd;width:100%;text-align:center;padding:12px;">No gifts for this department in the hardcoded list.</div>';
                return;
            }

            filtered.forEach(g => {
                const img = document.createElement("img");
                img.className = "gallery-thumb";
                img.alt = g.name || "gift";
                // Uses hardcoded image path
                if (g.image && g.image.trim()) {
                    img.src = g.image;
                } else {
                    img.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="100%" height="100%" fill="#e6f7ff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="18" fill="#004aad">${escapeHtml(g.name || 'Gift')}</text></svg>`)}`;
                }
                img.title = g.name;
                img.addEventListener('click', () => {
                    previewGift(g);
                });

                gallery.appendChild(img);
            });
        }

        // Function to Preview a Gift
        async function previewGift(giftObj) {
            winnerCard.style.display = "block";
            winnerNameEl.textContent = "🎁 Gift Preview";
            idNumberEl.textContent = `Department: ${giftObj.department || "General"}`;
            divisionNameEl.textContent = "Click 'Start Draw' to begin!";
            giftNameEl.textContent = `Featured Gift: ${giftObj.name}`;

            const giftImageSrc = (giftObj.image && giftObj.image.trim()) 
                ? giftObj.image 
                : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">${escapeHtml(giftObj.name || 'Gift')}</text></svg>`)}`;
            
            // Ensure the old image animates out before the new one animates in
            if (giftImageEl.classList.contains("entering") || giftImageEl.classList.contains("floating")) {
                giftImageEl.classList.remove("entering", "floating");
                giftImageEl.classList.add("leaving");
                await sleep(500); // Wait for leaving animation to complete
            } else if (giftImageEl.classList.contains("leaving")) {
                // If already leaving, just wait
                await sleep(500);
            }

            giftImageEl.src = giftImageSrc;
            giftImageEl.classList.remove("leaving"); // Remove leaving if it was there
            void giftImageEl.offsetWidth; // Trigger reflow to restart animation
            giftImageEl.classList.add("entering");

            // After the entering animation, start the continuous floating
            setTimeout(() => {
                giftImageEl.classList.remove("entering");
                giftImageEl.classList.add("floating"); // Add the new floating animation
            }, 700); // Duration of the 'entering' animation
        }


        document.getElementById("startDraw").addEventListener("click", async () => {
            if (!participants.length) {
                alert("Participant data is not loaded. Please upload participants first.");
                return;
            }
            // ➡️ Check the list used for the actual draw
            if (!giftsForDraw.length) {
                alert("Gift data for drawing is empty. Please upload the gift list first.");
                return;
            }

            // NEW: Get the desired number of draws
            const desiredDraws = parseInt(maxDrawsInput.value, 10);

            if (isNaN(desiredDraws) || desiredDraws < 1) {
                alert("Please enter a valid number of draws (1 or more).");
                return;
            }

            // DRAW MODIFICATION: Use giftsForDraw (from localStorage)
            const usableGifts = giftsForDraw.slice();

            // Calculate the actual number of draws, constrained by participants, gifts, and the user's input
            const numDraws = Math.min(participants.length, usableGifts.length, desiredDraws);

            if (numDraws === 0) {
                alert("Cannot run draw. Check participant count, gift count, and desired draws input.");
                return;
            }

            // Ensure the table is visible
            resultTable.style.display = "table";

            const shuffledParticipants = [...participants].sort(() => 0.5 - Math.random());
            const shuffledGifts = [...usableGifts].sort(() => 0.5 - Math.random());

            results = [];
            for (let i = 0; i < numDraws; i++) {
                // The `gift` object here contains the gift details from the UPLOADED file
                results.push({
                    name: shuffledParticipants[i].name,
                    division: shuffledParticipants[i].division,
                    idCard: shuffledParticipants[i].idCard,
                    gift: shuffledGifts[i], 
                });
            }

            resultBody.innerHTML = "";
            index = 0;

            // Remove floating animation when draw starts
            giftImageEl.classList.remove("floating"); 
            document.getElementById("doneMessage").style.display = "none";
            runDrawSequence();

            // NEW: Update the total gifts available to reflect the draw (simulated replacement)
            totalGiftsDisplay.textContent = giftsForDraw.length - results.length;
            maxDrawsInput.max = giftsForDraw.length - results.length;
            maxDrawsInput.value = Math.min(1, giftsForDraw.length - results.length);
        });

        document.getElementById("restartBtn").addEventListener("click", () => {
            // Reset state
            results = [];
            index = 0;
            resultBody.innerHTML = "";
            resultTable.style.display = "none";
            winnerCard.style.display = "none";
            document.getElementById("doneMessage").style.display = "none";
            
            // Ensure image is reset for next preview/draw, including removing floating
            giftImageEl.src = "";
            giftImageEl.classList.remove("entering", "leaving", "floating");


            // Reset preview content text
            winnerNameEl.textContent = "🎁 Gift Preview / 🏆 Winner Name";
            idNumberEl.textContent = "🪪 ID Card Number";
            divisionNameEl.textContent = "🏢 Division";
            giftNameEl.textContent = "🎁 Gift Name";

            // NEW: Reset gift count display and max draws input to initial state
            const savedGifts = localStorage.getItem("giftsData"); 
            if (savedGifts) {
                giftsForDraw = JSON.parse(savedGifts).map((g) => ({
                    name: g.name || g.Gift || g.GiftName || g["Gift Name"] || g.Name || String(g).trim(),
                    department: g.department || g.Department || g.Division || "General",
                    image: g.image || g.ImageURL || g.Image || g.img || "",
                }));
            } else {
                giftsForDraw = [];
            }
            totalGiftsDisplay.textContent = giftsForDraw.length;
            maxDrawsInput.max = giftsForDraw.length;
            maxDrawsInput.value = Math.min(1, giftsForDraw.length);
        });

        async function runDrawSequence() {
            for (let i = 0; i < results.length; i++) {
                if (i === 0) {
                    await startCountdown(10);
                } else {
                    // If it's not the first draw, make the current image leave
                    giftImageEl.classList.remove("entering", "floating"); // Ensure floating is removed
                    giftImageEl.classList.add("leaving");
                    await sleep(500); // Wait for the leaving animation to finish
                    winnerCard.style.display = "none"; // Hide the card temporarily
                }
                await announceWinnerSequence();
            }

            const doneMsg = document.getElementById("doneMessage");
            doneMsg.style.display = "block";

            if (typeof confetti === "function") {
                confetti({ particleCount: 300, spread: 120, origin: { y: 0.6 } });
            }
        }

        function startCountdown(seconds) {
            return new Promise((resolve) => {
                let count = seconds;
                loader.textContent = count;
                loader.style.display = "flex";

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        loader.textContent = count;
                    } else {
                        clearInterval(timer);
                        loader.style.display = "none";
                        resolve();
                    }
                }, 1000);
            });
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        async function announceWinnerSequence() {
            const winner = results[index];
            if (!winner) return;

            // The gift data for the winner comes from the UPLOADED list (winner.gift)
            const giftObj = winner.gift;
            const giftText = (typeof giftObj === "object" && giftObj !== null) ? (giftObj.name || JSON.stringify(giftObj)) : String(giftObj);
            
            // Find the corresponding hardcoded gift data for the image
            const displayGift = gifts.find(g => g.name === giftText);

            // populate text
            winnerNameEl.textContent = `🏆 ${winner.name}`;
            idNumberEl.textContent = `🪪 ${winner.idCard}`;
            divisionNameEl.textContent = `🏢 ${winner.division || "—"}`;
            giftNameEl.textContent = `🎁 ${giftText}`;


            // ➡️ Use the hardcoded image if a match is found, otherwise use fallback
            const imageSource = (displayGift && displayGift.image && displayGift.image.trim()) 
                ? displayGift.image 
                : `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial" font-size="24" fill="#004aad">Image Not Found for: ${escapeHtml(giftText)}</text></svg>`)}`;
            
            winnerCard.style.display = "block";
            
            // Image transition logic:
            if (index > 0) {
                // For subsequent draws, the leaving animation should have finished
                giftImageEl.src = imageSource;
                giftImageEl.classList.remove("leaving"); 
                void giftImageEl.offsetWidth; 
                giftImageEl.classList.add("entering");
            } else {
                // For the first draw, just fade in
                giftImageEl.src = imageSource;
                giftImageEl.classList.remove("leaving");
                giftImageEl.classList.add("entering");
            }

            // Ensure image animation completes
            await sleep(700); 
            giftImageEl.classList.remove("entering");


            // Add to the winners table
            const newRow = resultBody.insertRow();
            newRow.innerHTML = `
                <td>${index + 1}</td>
                <td>${winner.name}</td>
                <td>${winner.idCard}</td>
                <td>${winner.division}</td>
                <td>${giftText}</td>
            `;

            // Scroll to show the newest winner
            resultTable.scrollTop = resultTable.scrollHeight;
            index++;
        }
    </script>
</body>
</html>
